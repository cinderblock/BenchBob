name: CI

# Every push and PR: the server's tests, the web UI's, every package, a real install of
# the amd64 and arm64 ones on matching runners, and an upgrade from the Bun-based 0.4.1.
# A v* tag also publishes the packages as a GitHub Release.
on:
  push:
    branches: [master]
    # "v*" is anchored at the start of the tag name, so it doesn't match firmware-v*.
    tags: ["v*", "firmware-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- The server (backend/): tests and lint on x86-64 and arm64, then a static musl
  # binary for every target. The packages ship these binaries; nothing runs Bun on the box.
  # (The runners' passwordless sudo lets core's test that a dropped `sudo` child's program
  # dies run for real.) ----

  backend-test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  backend-build:
    needs: backend-test
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, arch: arm64 }
          # ARMv7 hard-float (BeagleBone Black, Pi 2), and ARMv6 hard-float (Pi Zero W,
          # Pi 1; also runs on ARMv7), which is the one the armhf package ships.
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
          - { target: arm-unknown-linux-musleabihf, arch: armhf }
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
      # No C dependencies: rust-lld links against the target's self-contained musl
      # (backend/.cargo/config.toml), so no cross toolchain is installed.
      - run: cargo build --locked --release --target ${{ matrix.target }} -p benchbob
      - name: Static and small
        run: |
          bin=target/${{ matrix.target }}/release/benchbob
          file "$bin"
          # x86-64 musl links static-pie; the others plain static.
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          ls -l "$bin"
      - name: Smoke test (x86-64)
        if: matrix.arch == 'amd64'
        run: |
          bin=target/${{ matrix.target }}/release/benchbob
          "$bin" --version
          mkdir -p /tmp/bb-state
          PORT=8099 BENCHBOB_STATE_DIR=/tmp/bb-state BENCHBOB_ROOT=$GITHUB_WORKSPACE "$bin" & pid=$!
          for i in $(seq 30); do curl -fsS http://localhost:8099/api > api.json && break; sleep 1; done
          jq -e '.name == "BenchBob API"' api.json
          curl -fsS http://localhost:8099/api/status | jq -e '.board.id and .system.cores > 0'
          # No web build in this job: / says how to make one.
          curl -fsS http://localhost:8099/ | grep -q "The dashboard isn't built"
          curl -fsS -X OPTIONS -H 'Origin: http://example.com' -H 'Access-Control-Request-Method: POST' -D - -o /dev/null http://localhost:8099/api/status | grep -qi '^access-control-allow-origin: \*'
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: benchbob-rust-${{ matrix.arch }}
          path: backend/target/${{ matrix.target }}/release/benchbob

  # The dashboard (web/): typecheck, component tests, and both builds (full and the
  # microcontroller-node one) with their size budget. The package jobs ship this build.
  # Bun is only a build tool here; the packages don't contain it.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-mcu
          path: web/dist-mcu

  # ---- Microcontroller node firmware (firmware/). A firmware-v* tag publishes it. ----

  firmware-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/proto
      - name: benchbob-proto (host)
        run: cargo test --locked
        working-directory: firmware/proto
      - name: UF2 and config tools
        run: bun test firmware/tools/

  firmware-build:
    needs: firmware-test
    strategy:
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            file: benchbob-node-pico2w.uf2
          - board: esp32c6
            target: riscv32imac-unknown-none-elf
            file: benchbob-node-esp32c6.bin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/${{ matrix.board }}
      - if: matrix.board == 'esp32c6'
        uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.6.0
      - run: firmware/build.sh ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: firmware/dist/${{ matrix.file }}

  firmware-release:
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    needs: firmware-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the firmware version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' firmware/proto/Cargo.toml | head -1)
          test "${{ github.ref_name }}" = "firmware-v$v" || { echo "tag ${{ github.ref_name }} != firmware-v$v" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum benchbob-node-pico2w.uf2 benchbob-node-esp32c6.bin > SHA256SUMS
      # --latest=false: the app's README links releases/latest/download/ for the .debs.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "Node firmware ${GITHUB_REF_NAME#firmware-}" --generate-notes --latest=false \
            dist/benchbob-node-pico2w.uf2 dist/benchbob-node-esp32c6.bin dist/SHA256SUMS

  # The .deb for each architecture: the server binary from backend-build, the web build,
  # the board files and the system glue. amd64 and arm64 are installed and smoke-tested on
  # matching runners; there is no armhf runner, so that one is built and inspected only.
  package:
    needs: [backend-build, web]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, install: true }
          - { arch: arm64, runner: ubuntu-24.04-arm, install: true }
          - { arch: armhf, runner: ubuntu-24.04, install: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/download-artifact@v4
        with:
          name: benchbob-rust-${{ matrix.arch }}
          path: server
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Build
        id: build
        env:
          RUST_BIN: server/benchbob
          WEB_DIST: web-dist
        run: |
          chmod +x server/benchbob
          echo "deb=$(packaging/build-deb.sh ${{ matrix.arch }})" >> "$GITHUB_OUTPUT"
      - name: Contents
        run: |
          deb="${{ steps.build.outputs.deb }}"
          dpkg-deb -I "$deb" | sed -n '/Package:/,/Recommends:/p'
          dpkg-deb -c "$deb" > contents.txt
          # The server alone: no Bun, no TypeScript, no old dashboard.
          if grep -E '/bin/bun$|\.ts$|/usr/lib/benchbob/(ui|peripherals)/|/usr/lib/benchbob/index\.html$' contents.txt; then
            echo "Bun-era files in the package" >&2; exit 1
          fi
          grep -q ' ./usr/lib/benchbob/bin/benchbob$' contents.txt
          grep -q ' ./usr/lib/benchbob/web/dist/index.html$' contents.txt
          grep -q ' ./usr/share/benchbob/boards/rpi.toml$' contents.txt
          ls -l "$deb"
      - name: Install
        if: matrix.install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${{ steps.build.outputs.deb }}"
      - name: Smoke test
        if: matrix.install
        run: |
          for i in $(seq 30); do curl -fsS http://localhost/api > api.json && break; sleep 2; done
          jq -e '.name == "BenchBob API" and .backend.server == "benchbob (Rust)"' api.json
          jq -e '.board.id and (.endpoints | has("POST /api/eject"))' api.json
          curl -fsS http://localhost/api/status | jq -e '.version != "dev" and (.peripherals.list | map(.id) | index("gpio") != null)'
          # The web UI at /, stamped with the build version, and its assets.
          curl -fsS http://localhost/ > index.html
          grep -q 'name="benchbob-build"' index.html
          if grep -q '__BUILD_VERSION__' index.html; then echo "index.html not stamped" >&2; exit 1; fi
          asset=$(grep -o 'assets/[^"]*\.js' index.html | head -1)
          curl -fsS "http://localhost/$asset" | head -c 100 > /dev/null
          curl -fsS http://localhost/api/boards | jq -e '.dirs[0] == "/usr/share/benchbob/boards" and (.errors | length) == 0'
          # CORS: a UI served elsewhere can use this bob.
          curl -fsS -D - -o /dev/null http://localhost/api/status | grep -qi '^access-control-allow-origin: \*'
          systemctl is-active benchbob
          # Another user's /proc/<pid>/exe needs root to read.
          test "$(sudo readlink /proc/$(systemctl show -p MainPID --value benchbob)/exe)" = /usr/lib/benchbob/bin/benchbob
          sudo -u benchbob sudo -n true
          test -d /var/lib/benchbob
      - name: Service log
        if: always() && matrix.install
        run: sudo journalctl -u benchbob --no-pager -n 200
      - name: Remove and purge
        if: matrix.install
        run: |
          sudo apt-get purge -y benchbob
          if systemctl is-active --quiet benchbob; then echo "still running" >&2; exit 1; fi
          test ! -e /var/lib/benchbob
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ steps.build.outputs.deb }}

  # Boxes on the Bun-based 0.4.1 get this package through apt, through apt while in the old
  # opt-in Rust mode, and through the dashboard's Update button: each must come up on the
  # Rust server with its settings (packaging/test-upgrade.sh).
  upgrade:
    needs: package
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: debs
      - run: sudo packaging/test-upgrade.sh debs/benchbob_*_${{ matrix.arch }}.deb
      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u benchbob -u benchbob-rust -u benchbob-update --no-pager -n 200
          sudo cat /var/log/benchbob-update.log || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
      # Unversioned copies too, so README links can use releases/latest/download/.
      - run: |
          for a in amd64 arm64 armhf; do cp benchbob_*_$a.deb benchbob_$a.deb; done
          sha256sum *.deb > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes ./*.deb SHA256SUMS

  # A Raspberry Pi OS Lite (64-bit) SD image with BenchBob preinstalled: attached to the
  # release on v* tags, or kept as a workflow artifact when run by hand.
  image:
    if: always() && needs.package.result == 'success' && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    needs: [package, release]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: debs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq parted e2fsprogs xz-utils
      - name: Build
        id: build
        run: |
          deb=$(ls debs/benchbob_*_arm64.deb)
          v=$(dpkg-deb -f "$deb" Version)
          out="benchbob-$v-raspios-lite-arm64.img.xz"
          sudo packaging/build-image.sh "$deb" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      # Boot the image's own systemd in a container (private network, no Pi kernel) and
      # wait for BenchBob to answer: the closest to a real first boot a runner can get.
      - name: Boot test
        run: |
          sudo apt-get install -y -qq systemd-container
          xz -dc "${{ steps.build.outputs.out }}" > boot.img
          # --image= only finds GPT root partitions; Pi OS is MBR, so mount it ourselves.
          loop=$(sudo losetup -f --show -P boot.img)
          mkdir -p root
          sudo mount "${loop}p2" root
          sudo mount "${loop}p1" root/boot/firmware
          sudo systemd-nspawn -D root --private-network --boot --machine=bbimg > boot.log 2>&1 &
          ok=
          for i in $(seq 90); do
            if sudo systemctl -M bbimg is-active --quiet benchbob 2>/dev/null &&
              sudo systemd-run -M bbimg --wait --pipe --quiet curl -fsS http://localhost/api/status > status.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          sudo systemctl -M bbimg --no-pager status benchbob | head -20 || true
          sudo machinectl poweroff bbimg || true
          sleep 5
          sudo umount root/boot/firmware root || true
          sudo losetup -d "$loop" || true
          [ -n "$ok" ] || { tail -60 boot.log; exit 1; }
          jq -c '{version, board: .board.id, model: .system.model}' status.json
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" "${{ steps.build.outputs.out }}" "${{ steps.build.outputs.out }}.sha256"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sd-image
          path: ${{ steps.build.outputs.out }}*
          compression-level: 0

  # The apt repository on GitHub Pages, rebuilt from the newest app releases each time.
  # Also runnable by hand (workflow_dispatch) to republish without a new release.
  # Pages keeps the first deployment of a commit: a manual run on the commit that then gets
  # tagged leaves the tag run's deploy (with the new release in it) unserved. To republish,
  # run this by hand on a newer commit.
  pages:
    if: always() && needs.package.result == 'success' && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    needs: [package, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq dpkg-dev apt-utils
      - name: Packages of the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          # App releases only (v*, not firmware-v*), newest three.
          for t in $(gh release list -R "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '[.[].tagName | select(startswith("v"))][:3][]'); do
            gh release download "$t" -R "${{ github.repository }}" -D debs -p 'benchbob_[0-9]*.deb'
          done
          ls -la debs
      - name: Build the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          packaging/build-apt-repo.sh debs site/apt
          cp packaging/site/index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
