name: CI

# Every push and PR: unit tests, both packages, and a real install of each on a matching
# runner. A v* tag also publishes the packages as a GitHub Release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test peripherals/ ./update.test.ts

  package:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - name: Build
        id: build
        run: echo "deb=$(packaging/build-deb.sh ${{ matrix.arch }})" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${{ steps.build.outputs.deb }}"
      - name: Smoke test
        run: |
          for i in $(seq 30); do curl -fsS http://localhost/api > api.json && break; sleep 2; done
          jq -e '.name == "BenchBob API"' api.json
          curl -fsS http://localhost/api/status | jq -e '.version != "dev"'
          curl -fsS http://localhost/ | grep -q '<h1 id="title">BenchBob</h1>'
          systemctl is-active benchbob
          sudo -u benchbob sudo -n true
          test -d /var/lib/benchbob
      - name: Service log
        if: always()
        run: sudo journalctl -u benchbob --no-pager -n 200
      - name: Remove and purge
        run: |
          sudo apt-get purge -y benchbob
          if systemctl is-active --quiet benchbob; then echo "still running" >&2; exit 1; fi
          test ! -e /var/lib/benchbob
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ steps.build.outputs.deb }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
      # Unversioned copies too, so README links can use releases/latest/download/.
      - run: |
          for a in amd64 arm64; do cp benchbob_*_$a.deb benchbob_$a.deb; done
          sha256sum *.deb > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes ./*.deb SHA256SUMS

  # A Raspberry Pi OS Lite (64-bit) SD image with BenchBob preinstalled: attached to the
  # release on v* tags, or kept as a workflow artifact when run by hand.
  image:
    if: always() && needs.package.result == 'success' && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    needs: [package, release]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: debs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq parted e2fsprogs xz-utils
      - name: Build
        id: build
        run: |
          deb=$(ls debs/benchbob_*_arm64.deb)
          v=$(dpkg-deb -f "$deb" Version)
          out="benchbob-$v-raspios-lite-arm64.img.xz"
          sudo packaging/build-image.sh "$deb" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      # Boot the image's own systemd in a container (private network, no Pi kernel) and
      # wait for BenchBob to answer: the closest to a real first boot a runner can get.
      - name: Boot test
        run: |
          sudo apt-get install -y -qq systemd-container
          xz -dc "${{ steps.build.outputs.out }}" > boot.img
          sudo systemd-nspawn --image=boot.img --private-network --boot --machine=bbimg > boot.log 2>&1 &
          ok=
          for i in $(seq 90); do
            if sudo systemctl -M bbimg is-active --quiet benchbob 2>/dev/null &&
              sudo systemd-run -M bbimg --wait --pipe --quiet curl -fsS http://localhost/api/status > status.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          sudo systemctl -M bbimg --no-pager status benchbob | head -20 || true
          sudo machinectl poweroff bbimg || true
          sleep 5
          [ -n "$ok" ] || { tail -60 boot.log; exit 1; }
          jq -c '{version, board: .board.id, model: .system.model}' status.json
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" "${{ steps.build.outputs.out }}" "${{ steps.build.outputs.out }}.sha256"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sd-image
          path: ${{ steps.build.outputs.out }}*
          compression-level: 0

  # The apt repository on GitHub Pages, rebuilt from the newest app releases each time.
  # Also runnable by hand (workflow_dispatch) to republish without a new release.
  pages:
    if: always() && needs.package.result == 'success' && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    needs: [package, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq dpkg-dev apt-utils
      - name: Packages of the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          # App releases only (v*, not firmware-v*), newest three.
          for t in $(gh release list -R "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '[.[].tagName | select(startswith("v"))][:3][]'); do
            gh release download "$t" -R "${{ github.repository }}" -D debs -p 'benchbob_[0-9]*.deb'
          done
          ls -la debs
      - name: Build the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          packaging/build-apt-repo.sh debs site/apt
          cp packaging/site/index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
