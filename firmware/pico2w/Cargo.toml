[package]
name = "benchbob-node-pico2w"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "BenchBob node firmware for the Raspberry Pi Pico 2 W (RP2350 + CYW43439)"
publish = false

[[bin]]
name = "benchbob-node-pico2w"
test = false
bench = false

[dependencies]
benchbob-proto = { path = "../proto" }
benchbob-node = { path = "../node", features = ["defmt"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "dhcpv4", "dhcpv4-hostname", "medium-ethernet", "multicast", "proto-ipv4"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
static_cell = "2.1.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }
heapless = "0.9"

[profile.release]
debug = 2 # symbols stay in the ELF only; the UF2 doesn't carry them
lto = "fat"
opt-level = "s"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = "s" # cyw43 is too slow unoptimised
