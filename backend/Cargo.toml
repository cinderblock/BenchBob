# BenchBob's Rust backend: one statically linked binary per architecture.
#
# Its own workspace, separate from firmware/ (no_std, embedded targets). Crates:
#   benchbob-core    driver registry, settings, udev hotplug, MCP, HTTP helpers
#   benchbob-ble     the Bluetooth LE panel: btmon capture, advertisers, beacon decoders
#   benchbob-boards  board definitions (TOML data files), loading and detection
#   benchbob-camera  the camera panel: UVC cameras through on-demand ustreamer children
#   benchbob-drives  drives, flashing, rpiboot, bootloader cards, files, OS detection
#   benchbob-gpio    the GPIO panel: gpiochip uAPI, passive level readers, boot config
#   benchbob-gps     the GPS panel: USB receivers through a temporary gpsd
#   benchbob-probes  the debug probes panel: OpenOCD GDB servers, flashing, UF2/DFU bootloaders
#   benchbob-sdr     the RTL-SDR panel: rtl_tcp, rtl_433, stick probing
#   benchbob-serial  the serial panel: termios2 ports, bridges, auto-baud, flashing
#   benchbob-i2c     the I²C panel: bus scans, identification, readings, raw tools
#   benchbob-i2c-chips  I²C chip identification + decoders (no_std, shared with firmware)
#   benchbob-ir-panel the IR panel: LIRC receive/send, the shared IR codec (benchbob-ir from firmware/)
#   benchbob-leds    the LED strips panel: WS2812/APA102 strings over spidev or the GPIO uAPI,
#                    with the nodes' string model (benchbob-proto, benchbob-pixels from firmware/)
#   benchbob-netdiag the wired-network panel: ethtool, receive-only LLDP, iperf3, quick checks
#   benchbob-onewire the 1-Wire panel: w1 sysfs masters/slaves, family decoders, DS2482 bridges
#   benchbob-ups     the UPS panel: USB UPSes through a private NUT
#   benchbob-usb     the USB panel: device tree, hotplug timeline, uhubctl power, USB/IP, usbredir
#   benchbob-wifi    the Wi-Fi panel: radios, regulatory channels, scanner, netns client tests
#   benchbob         the server binary: HTTP, UI, status, SSE, update, legacy proxy
# Each later panel (serial, CAN, I²C…) becomes its own crate registered in the binary.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[workspace.dependencies]
benchbob-core = { path = "crates/core" }
benchbob-ble = { path = "crates/ble" }
benchbob-boards = { path = "crates/boards" }
benchbob-camera = { path = "crates/camera" }
benchbob-can = { path = "crates/can" }
benchbob-drives = { path = "crates/drives" }
benchbob-gpio = { path = "crates/gpio" }
benchbob-gps = { path = "crates/gps" }
benchbob-probes = { path = "crates/probes" }
benchbob-sdr = { path = "crates/sdr" }
benchbob-serial = { path = "crates/serial" }
benchbob-ups = { path = "crates/ups" }
benchbob-i2c = { path = "crates/i2c" }
benchbob-i2c-chips = { path = "crates/i2c-chips" }
benchbob-leds = { path = "crates/leds" }
benchbob-ir-panel = { path = "crates/ir" }
benchbob-ir = { path = "../firmware/ir" }
# Shared with the firmware nodes: the LED string model and its API, and the pixel logic.
benchbob-pixels = { path = "../firmware/pixels" }
benchbob-proto = { path = "../firmware/proto" }
benchbob-netdiag = { path = "crates/netdiag" }
benchbob-onewire = { path = "crates/onewire" }
benchbob-usb = { path = "crates/usb" }
benchbob-wifi = { path = "crates/wifi" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
bytes = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
libm = "0.2.16"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: object keys come out in insertion order, as JavaScript's do, so the
# API's JSON matches the Bun server's byte for byte.
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = "0.6"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
# Small binaries for 32-bit boards and slow SD cards; a bench server isn't CPU-bound.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
