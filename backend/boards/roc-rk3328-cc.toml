# ==================== Libre Computer ====================
#
# UNTESTED: nobody here has one of these boards. The data below is the vendor's and the
# kernel's; what hasn't been checked is BenchBob running on the hardware.
#
# AML-S905X-CC "Le Potato" (Amlogic S905X) and its V2 "Sweet Potato" (identical header:
# the vendor's V2 pin map is a symlink to the V1 one), and ROC-RK3328-CC "Renegade".
#
# Sources, checked against each other pin by pin:
#  - Vendor pin maps (libretech-wiring-tool, commit 442faf9, 2026-10-05):
#    https://github.com/libre-computer-project/libretech-wiring-tool/blob/master/libre-computer/aml-s905x-cc/gpio.map
#    https://github.com/libre-computer-project/libretech-wiring-tool/blob/master/libre-computer/roc-rk3328-cc/gpio.map
#    The functions are the map's "Desc" column (SoC mux options). Its "Ref" column holds
#    schematic net names and is misleading in places (pins 27/28 say I2C_A; they're I2C_B).
#  - Kernel DT, whose gpio-line-names for Le Potato name every header pin and agree:
#    https://github.com/torvalds/linux/blob/master/arch/arm64/boot/dts/amlogic/meson-gxl-s905x-libretech-cc.dts
#  - Line offsets: include/dt-bindings/gpio/meson-gxl-gpio.h (aobus: GPIOAO_0..9 = 0..9,
#    TEST_N = 10; periphs: GPIODV_0 = 49, GPIOX_0 = 79, GPIOCLK_0 = 98). Chip labels from
#    drivers/pinctrl/meson/pinctrl-meson-gxl.c ("aobus-banks", "periphs-banks"); the chip
#    numbers depend on probe order, so match on the label. Rockchip: gpio-rockchip.c
#    labels each bank "gpioN"; offset = group (A=0…D=3) × 8 + index.
#
# Boot config: Libre's images apply overlays with `ldto merge <name>`, which writes a whole
# merged DTB under /boot/efi/dtb rather than a list we could edit, and Armbian's GXL
# overlays are written for the Odroid C2 and not confirmed for these pins. So these boards
# are read-only here; the notes list the vendor's overlay names.

id = "roc-rk3328-cc"
name = "Libre Computer ROC-RK3328-CC (Renegade)"
vendor = "Libre Computer"
soc = "Rockchip RK3328"
tested = false
health = "sysfs"
sources = [
  "https://github.com/libre-computer-project/libretech-wiring-tool/blob/master/libre-computer/roc-rk3328-cc/gpio.map",
  "https://github.com/torvalds/linux/blob/master/arch/arm64/boot/dts/rockchip/rk3328-roc-cc.dts",
]
notes = [
  "Header overlays come from Libre's wiring tool: `sudo ldto merge <name>` (i2c-0, i2c-1, spi-0-1cs, spi-0-2cs, uart-1, pwm-2). BenchBob doesn't edit the merged DTB it writes.",
]

[detect]
priority = 50
compatible = ['^firefly,roc-rk3328-cc$']

[[refine]]
name = "{model} (Renegade)"

[gpio]
panel = "gpiochip"
reader = "gpiochip"

# Chip keys → the gpiochip's uAPI label or sysfs device name.
[chips]
gpio0 = ["gpio0"]
gpio1 = ["gpio1"]
gpio2 = ["gpio2"]
gpio3 = ["gpio3"]

[[header]]
id = "j1"
name = "40-pin header (J1)"
pins = [
  { pin = 1, kind = "3v3" },
  { pin = 2, kind = "5v" },
  { pin = 3, soc = "GPIO2_D1", chip = "gpio2", line = 25, funcs = ["I2C0_SDA"] },
  { pin = 4, kind = "5v" },
  { pin = 5, soc = "GPIO2_D0", chip = "gpio2", line = 24, funcs = ["I2C0_SCL"] },
  { pin = 6, kind = "gnd" },
  { pin = 7, soc = "GPIO1_D4", chip = "gpio1", line = 28, funcs = ["CLK32K_OUT_M1"] },
  { pin = 8, soc = "GPIO3_A4", chip = "gpio3", line = 4, funcs = ["UART1_TX"] },
  { pin = 9, kind = "gnd" },
  { pin = 10, soc = "GPIO3_A6", chip = "gpio3", line = 6, funcs = ["UART1_RX"] },
  { pin = 11, soc = "GPIO2_C4", chip = "gpio2", line = 20, funcs = ["I2S1_SDIO1"] },
  { pin = 12, soc = "GPIO2_A6", chip = "gpio2", line = 6, funcs = ["PWM2"] },
  { pin = 13, soc = "GPIO2_C5", chip = "gpio2", line = 21, funcs = ["I2S1_SDIO2"] },
  { pin = 14, kind = "gnd" },
  { pin = 15, soc = "GPIO2_C6", chip = "gpio2", line = 22, funcs = ["I2S1_SDIO3"] },
  { pin = 16, soc = "GPIO3_A7", chip = "gpio3", line = 7, funcs = ["UART1_CTSN"] },
  { pin = 17, kind = "3v3" },
  { pin = 18, soc = "GPIO3_A5", chip = "gpio3", line = 5, funcs = ["UART1_RTSN"] },
  { pin = 19, soc = "GPIO3_A1", chip = "gpio3", line = 1, funcs = ["SPI_TXD_M2"] },
  { pin = 20, kind = "gnd" },
  { pin = 21, soc = "GPIO3_A2", chip = "gpio3", line = 2, funcs = ["SPI_RXD_M2"] },
  { pin = 22, soc = "GPIO0_A2", chip = "gpio0", line = 2, funcs = ["CLKOUT_GMAC_M0", "SPDIF_TX_M2"] },
  { pin = 23, soc = "GPIO3_A0", chip = "gpio3", line = 0, funcs = ["SPI_CLK_M2"] },
  { pin = 24, soc = "GPIO3_B0", chip = "gpio3", line = 8, funcs = ["SPI_CSN0_M2"] },
  { pin = 25, kind = "gnd" },
  { pin = 26, soc = "GPIO2_B4", chip = "gpio2", line = 12, funcs = ["SPI_CSN1_M0"] },
  { pin = 27, soc = "GPIO2_A4", chip = "gpio2", line = 4, funcs = ["PWM0", "I2C1_SDA"], note = "I²C1 is shared with the PMIC" },
  { pin = 28, soc = "GPIO2_A5", chip = "gpio2", line = 5, funcs = ["PWM1", "I2C1_SCL"], note = "I²C1 is shared with the PMIC" },
  { pin = 29, soc = "GPIO2_C3", chip = "gpio2", line = 19, funcs = ["I2S1_SDI"] },
  { pin = 30, kind = "gnd" },
  { pin = 31, soc = "GPIO2_C7", chip = "gpio2", line = 23, funcs = ["I2S1_SDO"] },
  { pin = 32, soc = "GPIO0_A0", chip = "gpio0", line = 0, funcs = ["CLKOUT_WIFI_M0"] },
  # Wired to two SoC lines through resistors; the vendor's first row is authoritative
  # and both must never be driven at once.
  { pin = 33, soc = "GPIO2_C0", chip = "gpio2", line = 16, funcs = ["I2S1_LRCK_RX"], note = "also wired to GPIO2_C1 (gpio2 line 17): never drive both" },
  { pin = 34, kind = "gnd" },
  { pin = 35, soc = "GPIO2_C2", chip = "gpio2", line = 18, funcs = ["I2S1_SCLK"] },
  { pin = 36, soc = "GPIO2_A0", chip = "gpio2", line = 0, funcs = ["UART2_TX_M1"] },
  { pin = 37, soc = "GPIO2_B7", chip = "gpio2", line = 15, funcs = ["I2S1_MCLK"] },
  { pin = 38, soc = "GPIO2_A1", chip = "gpio2", line = 1, funcs = ["UART2_RX_M1"] },
  { pin = 39, kind = "gnd" },
  { pin = 40, soc = "GPIO0_D3", chip = "gpio0", line = 27, funcs = ["SPDIF_TX_M0"] },
]
