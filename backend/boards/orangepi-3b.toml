# ==================== Orange Pi (Shenzhen Xunlong) ====================
#
# UNTESTED: nobody here has an Orange Pi. The pinouts are the vendor's and the kernel's;
# what hasn't been checked is BenchBob running on the hardware.
#
# Boards: Orange Pi 5 / 5B (RK3588S, 26-pin), 5 Plus (RK3588, 40-pin), 3B (RK3566,
# 40-pin), Zero 3 (H618, 26-pin + 13-pin) and Zero 2W (H618, 40-pin). The 5 Pro, 5 Max and
# 5 Ultra are recognised but have no header map: their 40-pin headers differ from the
# 5 Plus (wiringOP has a separate table for each) and we haven't sourced them.
#
# Sources:
#  - Vendor wiki pin tables (the online user manuals):
#    http://www.orangepi.org/orangepiwiki/index.php/26_Pin_Interface_Pin_Description (OPi 5)
#    http://www.orangepi.org/orangepiwiki/index.php/Orange_Pi_5_Plus
#    http://www.orangepi.org/orangepiwiki/index.php/Orange_Pi_3B
#    http://www.orangepi.org/orangepiwiki/index.php/Orange_Pi_Zero_3
#    http://www.orangepi.org/orangepiwiki/index.php/Orange_Pi_Zero_2W
#  - Orange Pi's wiringOP (physToGpio_* / physNames_*), which agrees with the OPi 5 table
#    on every pin and corrects the 5 Plus wiki, whose GPIO numbers for pins 8, 10, 16, 18
#    don't match the pin names printed beside them (it says 109/110/32/33):
#    https://github.com/orangepi-xunlong/wiringOP/blob/next/wiringPi/wiringPi.c
#  - Kernel: compatible strings from the mainline dts files (arch/arm64/boot/dts/rockchip
#    and allwinner) and Orange Pi's kernel (orangepi-xunlong/linux-orangepi), whose
#    strings differ ("rockchip,rk3588s-orangepi-5", "allwinner,sun50i-h616" on a Zero 3).
#    Chip labels: gpio-rockchip.c labels banks "gpio0".."gpio4" (offset = group A–D × 8 +
#    index); sunxi labels its controller by device name ("300b000.pinctrl" on H616/H618,
#    offset = (port − 'A') × 32 + n). Register bases from rk3588-base.dtsi,
#    rk356x-base.dtsi, sun50i-h616.dtsi.
#
# Gotcha for users comparing with the vendor's numbers: on mainline kernels Rockchip GPIO
# bases are dynamic (512+), so the vendor's "GPIO 47" isn't Linux GPIO 47 there. The
# header map is chip + line, which is the same on both kernels.
#
# Boot config: Orange Pi's images keep overlays in /boot/orangepiEnv.txt, Armbian in
# /boot/armbianEnv.txt (same `overlays=` format). The overlay *names* differ between the
# two (Zero 3: "ph-i2c3" vs "i2c3-ph"; Armbian's vendor-kernel Rockchip images want the
# full "rk3588-i2c5-m3"), so the panel offers what is installed in the overlay directory
# and uses the catalogs below only to say which pins each takes.

id = "orangepi-3b"
name = "Orange Pi 3B"
vendor = "Orange Pi"
soc = "Rockchip RK3566"
tested = false
health = "sysfs"
sources = [
  "http://www.orangepi.org/orangepiwiki/index.php/Orange_Pi_3B",
  "https://github.com/torvalds/linux/blob/master/arch/arm64/boot/dts/rockchip/rk3566-orangepi-3b.dtsi",
]

[detect]
priority = 50
compatible = ['^xunlong,orangepi-3b', '^rockchip,rk3566-orangepi-3b$']

[gpio]
panel = "gpiochip"
reader = "gpiochip"

# Chip keys → the gpiochip's uAPI label or sysfs device name.
[chips]
gpio0 = ["gpio0", "fdd60000.gpio"]
gpio1 = ["gpio1", "fe740000.gpio"]
gpio2 = ["gpio2", "fe750000.gpio"]
gpio3 = ["gpio3", "fe760000.gpio"]
gpio4 = ["gpio4", "fe770000.gpio"]

# The wiki publishes this table as images only (Pi3b-img255-1.png); it doesn't say
# whether v1.1 and v2.1 differ.
[[header]]
id = "40pin"
name = "40-pin header"
pins = [
  { pin = 1, kind = "3v3" },
  { pin = 2, kind = "5v" },
  { pin = 3, soc = "GPIO4_B4", chip = "gpio4", line = 12, funcs = ["I2C2_SDA_M1"] },
  { pin = 4, kind = "5v" },
  { pin = 5, soc = "GPIO4_B5", chip = "gpio4", line = 13, funcs = ["I2C2_SCL_M1"] },
  { pin = 6, kind = "gnd" },
  { pin = 7, soc = "GPIO4_C3", chip = "gpio4", line = 19, funcs = ["PWM15_IR_M1"] },
  { pin = 8, soc = "GPIO0_D1", chip = "gpio0", line = 25, funcs = ["UART2_TX_M0"], note = "debug console" },
  { pin = 9, kind = "gnd" },
  { pin = 10, soc = "GPIO0_D0", chip = "gpio0", line = 24, funcs = ["UART2_RX_M0"], note = "debug console" },
  { pin = 11, soc = "GPIO3_C6", chip = "gpio3", line = 22 },
  { pin = 12, soc = "GPIO3_C7", chip = "gpio3", line = 23 },
  { pin = 13, soc = "GPIO4_A0", chip = "gpio4", line = 0 },
  { pin = 14, kind = "gnd" },
  { pin = 15, soc = "GPIO4_A2", chip = "gpio4", line = 2, funcs = ["UART7_TX_M2"] },
  { pin = 16, soc = "GPIO4_A3", chip = "gpio4", line = 3, funcs = ["UART7_RX_M2"] },
  { pin = 17, kind = "3v3" },
  { pin = 18, soc = "GPIO4_A1", chip = "gpio4", line = 1 },
  { pin = 19, soc = "GPIO4_B2", chip = "gpio4", line = 10, funcs = ["SPI3_MOSI_M0", "I2C4_SDA_M0"] },
  { pin = 20, kind = "gnd" },
  { pin = 21, soc = "GPIO4_B0", chip = "gpio4", line = 8, funcs = ["SPI3_MISO_M0"] },
  { pin = 22, soc = "GPIO4_A4", chip = "gpio4", line = 4, funcs = ["UART9_TX_M2"] },
  { pin = 23, soc = "GPIO4_B3", chip = "gpio4", line = 11, funcs = ["SPI3_CLK_M0", "I2C4_SCL_M0"] },
  { pin = 24, soc = "GPIO4_A6", chip = "gpio4", line = 6, funcs = ["SPI3_CS0_M0"] },
  { pin = 25, kind = "gnd" },
  { pin = 26, soc = "GPIO4_A7", chip = "gpio4", line = 7, funcs = ["SPI3_CS1_M0"] },
  { pin = 27, soc = "GPIO1_A0", chip = "gpio1", line = 0, funcs = ["I2C3_SDA_M0", "UART3_RX_M0"] },
  { pin = 28, soc = "GPIO1_A1", chip = "gpio1", line = 1, funcs = ["I2C3_SCL_M0", "UART3_TX_M0"] },
  { pin = 29, soc = "GPIO4_A5", chip = "gpio4", line = 5, funcs = ["UART9_RX_M2"] },
  { pin = 30, kind = "gnd" },
  { pin = 31, soc = "GPIO3_D4", chip = "gpio3", line = 28 },
  { pin = 32, soc = "GPIO4_C0", chip = "gpio4", line = 16, funcs = ["PWM11_IR_M1"] },
  { pin = 33, soc = "GPIO3_D7", chip = "gpio3", line = 31 },
  { pin = 34, kind = "gnd" },
  { pin = 35, soc = "GPIO3_D0", chip = "gpio3", line = 24 },
  { pin = 36, soc = "GPIO3_D5", chip = "gpio3", line = 29 },
  { pin = 37, soc = "GPIO3_D3", chip = "gpio3", line = 27 },
  { pin = 38, soc = "GPIO3_D2", chip = "gpio3", line = 26 },
  { pin = 39, kind = "gnd" },
  { pin = 40, soc = "GPIO3_D1", chip = "gpio3", line = 25 },
]

# Orange Pi 3B manual (overlay_prefix=rk356x); Armbian mainline uses the same short names.
[boot]
files = [
  { kind = "armbianEnv", path = "/boot/armbianEnv.txt" },
  { kind = "orangepiEnv", path = "/boot/orangepiEnv.txt" },
]
overlay_dirs = ["/boot/dtb/rockchip/overlay"]
overlays = [
  { name = "i2c2-m1", what = "I²C2 (SDA 3, SCL 5)", pins = [3, 5] },
  { name = "i2c3-m0", what = "I²C3 (SDA 27, SCL 28)", pins = [27, 28] },
  { name = "i2c4-m0", what = "I²C4 (SDA 19, SCL 23)", pins = [19, 23] },
  { name = "uart3-m0", what = "UART3 (TX 28, RX 27)", pins = [28, 27] },
  { name = "uart7-m2", what = "UART7 (TX 15, RX 16)", pins = [15, 16] },
  { name = "uart9-m2", what = "UART9 (TX 22, RX 29)", pins = [22, 29] },
  { name = "pwm11-m1", what = "PWM11 on 32", pins = [32] },
  { name = "pwm15-m1", what = "PWM15 on 7", pins = [7] },
  { name = "spi3-m0-cs0-spidev", what = "SPI3 → spidev3.0 (MOSI 19, MISO 21, CLK 23, CS0 24)", pins = [19, 21, 23, 24], spi = { dev = "/dev/spidev3.0", mosi = 19, sclk = 23 } },
]
