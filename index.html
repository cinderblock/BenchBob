// ==================== Raw Sector Inspection ====================
// A filesystem reporting "empty" says nothing about what is still on the media.
// Probe samples raw blocks; Deep Scan reads everything.

const KIND_COLORS = {
  zero:       { c:'#39404f', label:'zeroed' },
  ones:       { c:'#7a5c2e', label:'0xFF (erased flash)' },
  text:       { c:'#4ea1ff', label:'text' },
  compressed: { c:'#ff9f43', label:'compressed / encrypted' },
  structured: { c:'#5ad18c', label:'structured data' },
};

async function probeDrive(dev) {
  toast('Sampling raw sectors...','info');
  try {
    const r = await (await fetch('/api/probe', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device:dev}) })).json();
    if (!r.ok) { toast(r.message || 'Probe failed', 'error'); return; }
    showProbeModal(r);
  } catch(e) { toast('Probe failed','error'); }
}

function showProbeModal(r) {
  const total = r.sampledBlocks || 1;
  const bar = Object.entries(KIND_COLORS).map(([k,v]) => {
    const n = r.counts[k] || 0;
    if (!n) return '';
    return `<div style="width:${(n/total*100).toFixed(2)}%;background:${v.c}" title="${v.label}: ${n} block(s)"></div>`;
  }).join('');

  const legend = Object.entries(KIND_COLORS).filter(([k]) => r.counts[k]).map(([k,v]) =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap">
       <i style="width:9px;height:9px;border-radius:2px;background:${v.c};display:inline-block"></i>
       ${esc(v.label)} <b>${((r.counts[k]/total)*100).toFixed(0)}%</b></span>`).join('');

  // Device-order strip: each sample in place, so clusters of data are visible.
  const strip = r.map.map(m =>
    `<i style="flex:1;min-width:1px;background:${KIND_COLORS[m.k]?.c || '#555'}"
        title="${fmtSz(m.o)} — ${esc(KIND_COLORS[m.k]?.label || m.k)}, entropy ${m.e}"></i>`).join('');

  const gaps = r.unallocated || { ranges:[], sampled:0, withData:0 };
  const gapBytes = gaps.ranges.reduce((a,g) => a + g.bytes, 0);
  const gapWarn = gaps.withData > 0;

  let sigHtml;
  if (!r.signatures.length) {
    sigHtml = `<div style="color:var(--dim);font-size:.8rem">No known file signatures in the sampled blocks.</div>`;
  } else {
    sigHtml = `<div style="display:flex;flex-direction:column;gap:4px">` + r.signatures.map(s =>
      `<div style="display:flex;justify-content:space-between;gap:10px;font-size:.78rem">
         <span>${esc(s.name)}</span>
         <span style="color:var(--dim);font-family:monospace">${s.offsets.slice(0,4).map(o=>fmtSz(o)).join(', ')}${s.offsets.length>4?' …':''}</span>
       </div>`).join('') + `</div>`;
  }

  showModal(`<h3>Raw Probe — /dev/${esc(r.device)}</h3>
    <p style="font-size:.8rem;color:var(--dim);margin-top:-4px">
      Sampled ${r.sampledBlocks} blocks (${fmtSz(r.bytesRead)}) across ${fmtSz(r.sizeBytes)} —
      <b style="color:var(--fg)">${r.emptyPct}% empty</b>
    </p>

    <div style="display:flex;height:14px;border-radius:4px;overflow:hidden;margin:10px 0 6px">${bar}</div>
    <div style="font-size:.72rem;color:var(--dim);margin-bottom:12px">${legend}</div>

    <div style="font-size:.72rem;color:var(--dim);margin-bottom:3px">Layout (start → end of device)</div>
    <div style="display:flex;height:22px;gap:1px;border-radius:3px;overflow:hidden;margin-bottom:12px">${strip}</div>

    <div style="font-size:.78rem;margin-bottom:10px;padding:8px 10px;border-radius:5px;
                background:${gapWarn?'rgba(255,159,67,.12)':'rgba(255,255,255,.04)'}">
      <b>Outside any partition:</b> ${gaps.ranges.length} region(s), ${fmtSz(gapBytes)} —
      ${gaps.sampled} block(s) sampled,
      <b style="color:${gapWarn?'#ff9f43':'inherit'}">${gaps.withData} with data</b>
      ${gapWarn ? '<div style="color:var(--dim);margin-top:3px">Leftover content from a previous image is still readable here.</div>' : ''}
    </div>

    <div style="font-size:.72rem;color:var(--dim);margin-bottom:3px">Signatures found</div>
    ${sigHtml}

    <div class="modal-btns" style="margin-top:14px">
      <button class="btn" id="mc">Close</button>
      <button class="btn btn-primary" id="mk">Deep Scan</button>
    </div>`);
  Q('#mc').onclick = hideModal;
  Q('#mk').onclick = () => { hideModal(); deepScanDrive(r.device, r.device, r.sizeBytes); };
  Q('#modal-bg').onclick = e => { if (e.target === Q('#modal-bg')) hideModal(); };
}

async function deepScanDrive(dev, model, size) {
  if (!await confirm2('Deep Scan',
      'Read the entire device looking for file signatures? Read-only, but it takes roughly as long as a full read.',
      `${model}\n/dev/${dev} · ${fmtSz(size)}`)) return;
  try {
    const r = await (await fetch('/api/deepscan', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({device:dev}) })).json();
    toast(r.message, r.ok?'info':'error');
  } catch(e) { toast('Deep scan failed','error'); }
}

// Deep scan results arrive on the op via SSE; show each one once, when it completes.
const shownScans = new Set();

function checkScanResults(drives) {
  for (const d of drives) {
    for (const o of (d.operations || [])) {
      if (o.type === 'deepscan' && o.status === 'done' && o.scanResult && !shownScans.has(o.id)) {
        shownScans.add(o.id);
        showScanModal(d.name, o.scanResult);
      }
    }
  }
}

function showScanModal(dev, res) {
  const rows = res.signatures.length
    ? res.signatures.map(s =>
        `<div style="display:flex;justify-content:space-between;gap:10px;font-size:.78rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)">
           <span>${esc(s.name)}</span>
           <span style="color:var(--dim);white-space:nowrap"><b style="color:var(--fg)">${s.count}</b> ·
             <span style="font-family:monospace">${s.first.slice(0,3).map(o=>fmtSz(o)).join(', ')}${s.first.length>3?' …':''}</span></span>
         </div>`).join('')
    : `<div style="color:var(--dim);font-size:.8rem">No known file signatures anywhere on the device — it really is blank.</div>`;

  showModal(`<h3>Deep Scan — /dev/${esc(dev)}</h3>
    <p style="font-size:.8rem;color:var(--dim);margin-top:-4px">
      Read ${fmtSz(res.bytesScanned)} · ${res.signatures.length} signature type(s)
    </p>
    <div style="max-height:min(50vh,420px);overflow:auto;margin-top:10px">${rows}</div>
    <div class="modal-btns" style="margin-top:14px"><button class="btn btn-primary" id="mk">Close</button></div>`);
  Q('#mk').onclick = hideModal;
  Q('#modal-bg').onclick = e => { if (e.target === Q('#modal-bg')) hideModal(); };
}

}

function scrollToDrive(name) {

// ==================== OS Detection ====================
// /api/osinfo inspects a disk's mounted partitions: EFI loaders, Windows/Linux/macOS
// installs, Pi bootfs. Fetched once per drive per set of mounts, then re-rendered.

const osInfo = {}; // device -> { key, data, loading }
const OS_ICONS = { windows:'🪟', linux:'🐧', pi:'🍓', macos:'🍎' };

function ensureOsInfo(d) {
  if (!d.children?.length) return;
  const key = d.children.map(p => `${p.name}=${p.fstype || ''}@${p.mountpoint || ''}`).join(',');
  if (osInfo[d.name]?.key === key) return;
  // A new key can mean a different drive under the same name: never show the old data.
  const entry = osInfo[d.name] = { key, data: null, loading: true };
  fetch('/api/osinfo?device=' + encodeURIComponent(d.name)).then(r => r.json()).then(r => {
    if (osInfo[d.name] !== entry) return;
    entry.data = r.ok ? r : null;
    entry.loading = false;
    render();
    if (fb && filesInfoTarget(fb.path)) renderFiles(true);
  }).catch(() => { entry.loading = false; });
}

function osPart(dev, part) { return osInfo[dev]?.data?.partitions?.find(p => p.name === part) || null; }

function partOsLabel(p) {
  if (p.windows) return [p.windows.product, p.windows.version].filter(Boolean).join(' ');
  if (p.linux) return p.linux.name;
  if (p.macos) return [p.macos.name, p.macos.version].filter(Boolean).join(' ');
  if (p.pi) return 'Raspberry Pi boot';
  return null;
}

function driveOsHtml(d) {
  const info = osInfo[d.name]?.data;
  if (!info) return '';
  if (info.systems.length) {
    return '<div class="drive-os">' + info.systems.map(s =>
      `<div><span title="${esc(s.kind)}">${OS_ICONS[s.kind] || '💽'}</span> <b>${esc(s.name)}</b>
        <span class="sub">${[s.partition, s.detail].filter(Boolean).map(esc).join(' · ')}</span></div>`).join('') + '</div>';
  }
  const loaders = info.partitions.flatMap(p => p.esp?.loaders || []).filter(l => l.kind === 'os');
  if (loaders.length) return `<div class="drive-os"><div class="sub">No readable OS · EFI loaders for ${loaders.map(l => esc(l.name)).join(', ')}</div></div>`;
  return '';
}

// The drive/partition whose mount root is `path`, if it has anything to show.
function filesInfoTarget(path) {
  if (!path || path.includes('/')) return null;
  for (const [dev, c] of Object.entries(osInfo)) {
    const p = c.data?.partitions?.find(x => x.path === path);
    if (p && (p.esp || p.windows || p.linux || p.pi || p.macos)) return { dev, part: p, disk: c.data };
  }
  return null;
}

let fbInfoOpen = true;

function filesInfoHtml(t) {
  const { part: p, disk } = t;
  const sections = [];
  let title = '';
  const kv = rows => '<div class="fb-kv">' + rows.filter(r => r[1] != null && r[1] !== '').map(([k, v]) => `<span>${esc(k)}</span><span>${v}</span>`).join('') + '</div>';
  const espEntriesFor = name => disk.partitions.flatMap(q => q.esp?.windowsBoot?.entries || []).filter(e => e.partition === name);

  if (p.esp) {
    const e = p.esp;
    title = `💾 EFI System Partition — ${e.loaders.length} loader folder${e.loaders.length === 1 ? '' : 's'}`;
    let h = '<div><h4>Boot loaders</h4><table class="fb-ld"><colgroup><col style="width:30%"><col style="width:22%"><col style="width:9%"><col></colgroup>';
    for (const l of e.loaders) {
      const notes = [];
      if (l.shim) notes.push('Secure Boot shim');
      if (l.target) {
        notes.push(l.target.partition
          ? `GRUB loads <b>/boot</b> from ${esc(l.target.partition)}${l.target.system ? ' — ' + esc(l.target.system) : ''}`
          : `<span class="fb-warn">⚠ GRUB looks for filesystem <span class="mono">${esc(l.target.uuid)}</span>, which isn't on this drive — left over from a removed install</span>`);
      }
      if (l.kind === 'fallback' && e.fallback) {
        const f = e.fallback, file = esc(f.file.split('/').pop());
        if (f.sameAs) {
          notes.push(`${file} is a copy of <span class="mono">EFI/${esc(f.sameAs)}</span>`);
          const src = e.loaders.find(x => f.sameAs.toLowerCase().startsWith(x.dir.toLowerCase() + '/'));
          if (src?.target && !src.target.partition) notes.push(`<span class="fb-warn">⚠ so the firmware's fallback boot leads to that broken GRUB</span>`);
        } else {
          notes.push(`${file} doesn't match any other loader here`);
        }
      }
      if (l.dir.toLowerCase() === 'microsoft' && e.windowsBoot) {
        const menu = e.windowsBoot.entries.filter(x => x.inMenu);
        if (menu.length) notes.push('Menu: ' + menu.map(x => `"${esc(x.description)}"${x.partition ? ' → ' + esc(x.partition) : ''}${x.isDefault ? ' (default)' : ''}`).join(', '));
      }
      h += `<tr title="${esc(l.files.join('\n'))}"><td>${esc(l.name)}</td><td class="mono">EFI/${esc(l.dir)}</td><td class="mono">${esc(l.arch || '')}</td>`
         + `<td>${notes.join('<br>') || `<span class="mono">${esc(l.files.join(', ') || 'no .efi files')}</span>`}</td></tr>`;
    }
    h += '</table></div>';
    sections.push(h);

    if (e.windowsBoot?.entries.length) {
      const wb = e.windowsBoot;
      let w = `<div><h4>Windows boot configuration (BCD)${wb.timeout != null ? ` · menu timeout ${wb.timeout}s` : ''}</h4><table class="fb-ld"><colgroup><col style="width:38%"><col style="width:12%"><col></colgroup>`;
      for (const x of wb.entries) {
        const tags = [x.isDefault && 'default', x.inMenu && 'in menu', x.kind !== 'os' && x.kind].filter(Boolean).map(t => `<span class="fb-tag">${t}</span>`).join('');
        w += `<tr><td>${esc(x.description)}${tags}</td><td class="mono">${esc(x.partition || '?')}</td><td class="mono">${esc(x.path || '')}</td></tr>`;
      }
      sections.push(w + '</table></div>');
    }

    if (e.systemdBoot?.entries.length) {
      const sb = e.systemdBoot;
      sections.push('<div><h4>systemd-boot entries</h4><table class="fb-ld">' + sb.entries.map(x =>
        `<tr><td>${esc(x.title)}${sb.default && x.file.startsWith(sb.default.replace(/\*.*$/, '')) ? '<span class="fb-tag">default</span>' : ''}</td><td class="mono">${esc(x.version || '')}</td><td class="mono">${esc(x.file)}</td></tr>`).join('') + '</table></div>');
    }
  }

  if (p.windows) {
    const w = p.windows;
    title = `🪟 ${[w.product, w.version].filter(Boolean).join(' ')}`;
    const via = espEntriesFor(p.name).filter(x => x.kind === 'os').map(x => `"${esc(x.description)}"${x.isDefault ? ' (default)' : ''}`);
    sections.push('<div><h4>Windows installation</h4>' + kv([
      ['Edition', esc(w.product) + (w.edition ? ` <span class="fb-tag">${esc(w.edition)}</span>` : '')],
      ['Version', esc(w.version)],
      ['Build', esc(w.build)],
      ['Installed', w.installed ? esc(new Date(w.installed).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' })) : null],
      ['PC name', esc(w.computerName)],
      ['Boot menu', via.length ? 'Windows Boot Manager: ' + via.join(', ') : '<span class="fb-warn">no boot entry on this drive points here</span>'],
    ]) + '</div>');
  }

  if (p.linux) {
    const l = p.linux;
    title = `${disk.partitions.some(q => q.pi?.rootPartition === p.name) ? '🍓' : '🐧'} ${l.name}`;
    const via = [
      ...disk.partitions.flatMap(q => (q.esp?.loaders || []).filter(x => x.target?.partition === p.name).map(x => `EFI/${esc(x.dir)} on ${esc(q.name)}`)),
      ...disk.partitions.filter(q => q.pi?.rootPartition === p.name).map(q => `Raspberry Pi bootfs on ${esc(q.name)}`),
    ];
    sections.push('<div><h4>Linux installation</h4>' + kv([
      ['OS', esc(l.name)],
      ['Hostname', esc(l.hostname)],
      ['Booted by', via.join(', ') || null],
    ]) + '</div>');
  }

  if (p.pi) {
    title = title || '🍓 Raspberry Pi boot partition';
    sections.push('<div><h4>Raspberry Pi boot partition</h4>' + kv([
      ['Image', esc(p.pi.image)],
      ['Root filesystem', p.pi.rootPartition ? esc(p.pi.rootPartition) : p.pi.rootPartuuid ? `<span class="fb-warn">PARTUUID ${esc(p.pi.rootPartuuid)} isn't on this drive</span>` : 'not set in cmdline.txt'],
    ]) + '</div>');
  }

  if (p.macos) {
    title = title || `🍎 ${p.macos.name} ${p.macos.version || ''}`;
    sections.push('<div><h4>macOS installation</h4>' + kv([['OS', esc(p.macos.name)], ['Version', esc(p.macos.version)]]) + '</div>');
  }

  return `<details class="fb-info" ${fbInfoOpen ? 'open' : ''} ontoggle="fbInfoOpen=this.open"><summary>${title}</summary><div class="fb-info-body">${sections.join('')}</div></details>`;
}

// ==================== File Browser ====================
// Read-only view of the auto-mounted partitions. Paths are relative to the server's
// files root (/srv/nfs/drives); '' is the list of drives itself.

// Root-relative path of a mountpoint, or null if it isn't browsable.
function filesRel(mountpoint) {
  const root = S?.filesRoot;
  if (!root || !mountpoint || !mountpoint.startsWith(root + '/')) return null;
  return mountpoint.slice(root.length + 1);
}

const FB_ICONS = { dir:'📁', file:'📄', broken:'⚠️', outside:'🚫', other:'⚙️' };
const FB_NOTES = { broken:'broken link', outside:'points outside this drive' };
let fb = null; // { path, entries, total, truncated, warning }
let fbSeq = 0;

function fbJoin(dir, name) { return dir ? dir + '/' + name : name; }
function fbDate(ms) { return ms ? new Date(ms).toLocaleString(undefined, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : ''; }

async function openFiles(path) {
  // Responses can arrive out of order when clicking quickly; only the latest renders.
  const seq = ++fbSeq;
  if (!fb) showFilesModal('<div class="fb-msg">Loading…</div>', path);
  try {
    const res = await fetch('/api/files?path=' + encodeURIComponent(path));
    const r = await res.json();
    if (seq !== fbSeq) return;
    if (!r.ok) { toast(r.message || 'Could not open folder', 'error'); if (!fb) hideModal(); return; }
    fb = r;
    renderFiles();
  } catch (e) {
    if (seq !== fbSeq) return;
    toast('Could not open folder', 'error');
    if (!fb) hideModal();
  }
}

function showFilesModal(listHtml, path) {
  const parts = path ? path.split('/') : [];
  let crumbs = `<a onclick="openFiles('')">drives</a>`;
  parts.forEach((seg, i) => {
    const sub = parts.slice(0, i + 1).join('/');
    crumbs += '<span class="sep">/</span>' + (i === parts.length - 1
      ? `<span class="cur">${esc(seg)}</span>`
      : `<a onclick="openFiles(${esc(JSON.stringify(sub))})">${esc(seg)}</a>`);
  });
  const info = filesInfoTarget(path);
  showModal(`<h3>Files</h3>
    <div class="fb-crumbs">${crumbs}</div>
    ${info ? filesInfoHtml(info) : ''}
    <input class="fb-filter" id="fb-filter" placeholder="Filter this folder…" autocomplete="off" spellcheck="false">
    <div class="fb-list${info ? ' short' : ''}" id="fb-list">${listHtml}</div>
    <div class="fb-foot"><span id="fb-foot"></span><button class="btn btn-primary" id="mk">Close</button></div>`, 'wide');
  Q('#mk').onclick = hideModal;
  Q('#modal-bg').onclick = e => { if (e.target === Q('#modal-bg')) hideModal(); };
  Q('#fb-filter').addEventListener('input', renderFileRows);
  Q('#fb-filter').focus();
}

// keepView: re-render in place (e.g. OS details arrived) without dropping the filter.
function renderFiles(keepView) {
  const q = keepView ? Q('#fb-filter')?.value || '' : '';
  const top = keepView ? Q('#fb-list')?.scrollTop || 0 : 0;
  showFilesModal('', fb.path);
  Q('#fb-filter').value = q;
  renderFileRows();
  Q('#fb-list').scrollTop = top;
}

function renderFileRows() {
  const q = Q('#fb-filter').value.trim().toLowerCase();
  const list = q ? fb.entries.filter(e => e.name.toLowerCase().includes(q)) : fb.entries;
  let h = '<table class="fb-tbl"><colgroup><col><col style="width:90px"><col style="width:170px"><col style="width:44px"></colgroup>'
        + '<thead><tr><th>Name</th><th style="text-align:right">Size</th><th style="text-align:right">Modified</th><th></th></tr></thead><tbody>';
  if (fb.path && !q) {
    const up = fb.path.split('/').slice(0, -1).join('/');
    h += `<tr class="nav" onclick="openFiles(${esc(JSON.stringify(up))})"><td colspan="4"><span class="fb-ico">⬆️</span>..</td></tr>`;
  }
  for (const e of list) {
    const p = fbJoin(fb.path, e.name);
    const note = FB_NOTES[e.type] ? ` (${FB_NOTES[e.type]})` : '';
    const link = e.link ? ` <span class="fb-link">→ ${esc(e.link)}${note}</span>` : '';
    const name = `<span class="fb-ico">${FB_ICONS[e.type] || FB_ICONS.other}</span>${esc(e.name)}${link}`;
    const size = e.size == null ? '' : fmtSz(e.size);
    const title = esc(e.name + (e.link ? ' → ' + e.link : ''));
    if (e.type === 'dir') {
      h += `<tr class="nav" title="${title}" onclick="openFiles(${esc(JSON.stringify(p))})"><td>${name}</td><td class="num"></td><td class="num">${fbDate(e.mtime)}</td><td></td></tr>`;
    } else if (e.type === 'file') {
      const href = '/api/download?path=' + encodeURIComponent(p);
      h += `<tr title="${title}"><td><a href="${href}" download style="color:inherit">${name}</a></td><td class="num">${size}</td><td class="num">${fbDate(e.mtime)}</td>`
         + `<td><a class="fb-dl" href="${href}" download title="Download">⬇️</a></td></tr>`;
    } else {
      h += `<tr title="${title}" style="color:var(--dim)"><td>${name}</td><td class="num">${size}</td><td class="num">${fbDate(e.mtime)}</td><td></td></tr>`;
    }
  }
  h += '</tbody></table>';
  if (!list.length) h += `<div class="fb-msg">${q ? 'Nothing matches the filter' : 'Empty folder'}</div>`;
  Q('#fb-list').innerHTML = h;

  const files = fb.entries.filter(e => e.type === 'file');
  let foot = `${fb.total} item${fb.total === 1 ? '' : 's'} · ${fmtSz(files.reduce((a, e) => a + (e.size || 0), 0))} in files`;
  if (q) foot = `${list.length} of ${fb.total} shown`;
  if (fb.truncated) foot += ` · only the first ${fb.entries.length} listed`;
  if (fb.warning) foot += ` · ⚠️ ${esc(fb.warning)}`;
  Q('#fb-foot').innerHTML = foot;
}

// ==================== Flash ====================
let boards = [];    // catalog board list: { name, tags, description, exclusive }
let fp = null;      // open flash picker: { dev, sel, tab, distro, q }
// Image lists kept on the server, as [{ key, label }] with catalog keys: starred images,
// and the images Quick Pi offers. They're separate on purpose.
const lists = { favorites: [], quick: [] };
const LIST_API = { favorites: '/api/favorites', quick: '/api/quicklist' };
const POPULAR_DISTROS = ['Ubuntu', 'DietPi', 'Armbian OS', 'Alpine Linux', 'Home Assistant', 'LibreELEC', 'Kali Linux', 'OctoPi'];
const RPIOS_EDITIONS = [['lite', 'Lite', 'No desktop'], ['desktop', 'Desktop', 'Desktop + basics'], ['full', 'Full', 'Desktop + all apps']];
const HOSTNAME_RE = /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/i;

async function flashDrive(dev, hostname) {
  await ensureCatalog();
  const result = await flashModal(dev, hostname);
  if (result) await startFlash(result);
}

async function quickPiDrive(dev) {
  await ensureCatalog();
  const result = await quickPiModal(dev);
  if (result) await startFlash(result);
}

async function startFlash(result) {
  try { localStorage.setItem('flashLast', result.imageKey); } catch {}
  try {
    const r = await (await fetch('/api/flash', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(result) })).json();
    if (!r.ok) toast(r.message, 'error');
  } catch(e) { toast('Flash failed','error'); }
}

async function ensureCatalog() {
  await Promise.all([!images.length && loadCatalog(), !Object.keys(defaults).length && loadDefaults()]);
}

async function loadCatalog() {
  try {
    const c = await (await fetch('/api/catalog')).json();
    images = c.images || [];
    themeFolders = null;
    boards = (c.devices || []).filter(b => b.tags.length);
  } catch { images = []; boards = []; }
}

async function loadLists() {
  await Promise.all(Object.keys(LIST_API).map(async n => {
    try { lists[n] = await (await fetch(LIST_API[n])).json(); } catch { lists[n] = []; }
  }));
}

function imgByKey(key) { return images.find(i => i.key === key); }
function inList(n, key) { return lists[n].some(f => f.key === key); }

async function toggleList(n, key, ev) {
  ev?.stopPropagation();
  const im = imgByKey(key);
  lists[n] = inList(n, key) ? lists[n].filter(f => f.key !== key) : [...lists[n], { key, label: im ? imgLabel(im) : key }];
  rerenderFlash();
  try {
    await fetch(LIST_API[n], { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(lists[n]) });
  } catch { toast('Saving the list failed','error'); }
}

// Redraw whichever flash dialog is open after a list or Quick Pi choice changes.
function rerenderFlash() { if (fp) renderPicker(); else if (Q('#qp-imgs')) renderQuickModal(); }

function imgLabel(im) {
  if (!im.rpios) return im.name;
  const ed = RPIOS_EDITIONS.find(e => e[0] === im.rpios.edition)?.[1] || im.rpios.edition;
  return `Pi OS ${ed} ${im.rpios.arch}-bit${im.rpios.legacy ? ' (legacy)' : ''}`;
}

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
function boardShort(name) { return name.replace(/^Raspberry Pi /, '').replace(/^(\d)/, 'Pi $1'); }
function imgBoards(im) { return boards.filter(b => b.tags.some(t => im.devices.includes(t))).map(b => boardShort(b.name)); }
function fitsBoard(im, b) { return !b || (im.devices.length ? b.tags.some(t => im.devices.includes(t)) : !b.exclusive); }
function takesSettings(im) { return ['systemd', 'cloudinit', 'cloudinit-rpi'].includes(im.initFormat); }
function curBoard() { let n; try { n = localStorage.getItem('flashBoard'); } catch {} return boards.find(b => b.name === n) || null; }
function setBoard(name) { try { localStorage.setItem('flashBoard', name); } catch {} renderPicker(); }
// A distro is usually the second folder (Ubuntu, Apertis). Themed folders like "Home
// automation" hold one folder per project instead, so go a level deeper there. A sub-folder
// that starts with its parent's name ("Apertis (daily build)") is still the same distro, and
// a lone sub-folder (Bass OS › Bass ARM) doesn't make a theme.
let themeFolders = null;
function isThemeFolder(id) {
  if (!themeFolders) {
    const kids = new Map();
    for (const { path: p } of images) {
      if (p.length < 3 || p[2].startsWith(p[1])) continue;
      const k = p.slice(0, 2).join(' › ');
      if (!kids.has(k)) kids.set(k, new Set());
      kids.get(k).add(p[2]);
    }
    themeFolders = new Set([...kids].filter(([, s]) => s.size > 1).map(([k]) => k));
  }
  return themeFolders.has(id);
}
function distroDepth(im) { return im.path.length > 2 && isThemeFolder(im.path.slice(0, 2).join(' › ')) ? 3 : 2; }
function distroOf(im) { return im.path.slice(0, distroDepth(im)).join(' › '); }
function distroName(id) { return id.split(' › ').pop() || 'Other'; }
function distroGroup(id) { const p = id.split(' › ').slice(0, -1); return p.length > 1 ? `${p[p.length - 1]}${p[0].startsWith('Freemium') ? ' (paid)' : ''}` : p[0]; }
function driveOf(dev) { return S?.drives?.find(d => d.name === dev); }

// Saved defaults as flash settings, for Quick Pi. Networks saved without a password (by an
// older dashboard, which stripped them) are left out rather than written as open networks.
function quickSettings(hostname) {
  const d = defaults;
  return {
    hostname, username: d.username || 'pi', password: '',
    enableSsh: d.enableSsh !== false, passwordlessSudo: !!d.passwordlessSudo,
    sshKeys: Array.isArray(d.sshKeys) ? d.sshKeys.filter(Boolean) : [],
    wifiNetworks: (Array.isArray(d.wifiNetworks) ? d.wifiNetworks : []).filter(w => w.ssid && w.password),
    timezone: d.timezone || 'UTC', keyboardLayout: d.keyboardLayout || 'us',
  };
}

// The Quick Pi list's images that are in the catalog, and the one to flash: the last one
// picked, else the first.
function quickImages() { return lists.quick.map(f => imgByKey(f.key)).filter(Boolean); }
function quickImage() {
  let k; try { k = localStorage.getItem('quickLast'); } catch {}
  const ims = quickImages();
  return ims.find(i => i.key === k) || ims[0] || null;
}
function pickQuick(key) { try { localStorage.setItem('quickLast', key); } catch {} rerenderFlash(); }

// Chips for choosing the Quick Pi image; entries gone from the catalog can be removed.
function quickChips() {
  const cur = quickImage();
  if (!lists.quick.length) return `<span class="dim">The list is empty. Add images with ⚡ in the flash dialog.</span>`;
  return lists.quick.map(f => {
    const im = imgByKey(f.key);
    if (!im) return `<span class="fp-chip gone" title="Not in the current catalog">${esc(f.label)}<span class="x" onclick="toggleList('quick', '${esc(f.key)}', event)" title="Remove">×</span></span>`;
    return `<span class="fp-chip qk${cur === im ? ' sel' : ''}" onclick="pickQuick('${esc(im.key)}')" title="${esc(im.name)} · ${fmtSz(im.downloadSize)}">${esc(imgLabel(im))}</span>`;
  }).join('');
}

// Why Quick Pi can't run with this image and the saved defaults, or '' if it can.
function quickBlocker(s, im) {
  if (!im) return lists.quick.length ? 'None of the Quick Pi images are in the catalog right now.' : 'The Quick Pi list is empty.';
  if (!takesSettings(im)) return `${im.name} ignores first-boot settings, so Quick Pi can't set its hostname or SSH keys.`;
  if (!s.enableSsh) return 'SSH is off in the saved defaults, so there would be no way in.';
  if (!s.sshKeys.length) return 'No SSH keys are saved in the defaults, and Quick Pi sets no password. Save a key with “Save as Default” first.';
  return '';
}

function flashRequest(im, dev, settings) {
  return { imageUrl: im.url, imageName: im.name, imageKey: im.key, extractSize: im.extractSize, device: dev, settings };
}

function devLine(dev) {
  const d = driveOf(dev);
  return `/dev/${esc(dev)}${d ? ` · ${esc(d.model || '')} · ${fmtSz(d.size)}` : ''}`;
}

function hostInput(id, value) {
  return `<input type="text" id="${id}" value="${esc(value || '')}" placeholder="e.g. garage-pi" autocomplete="off" spellcheck="false">`;
}

// Wire a hostname box: flag invalid names, and Enter presses the given button.
function wireHost(input, btn, ok) {
  input.addEventListener('input', () => { btn.disabled = !ok(); input.classList.toggle('bad', !!input.value && !HOSTNAME_RE.test(input.value.trim())); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
}

function renderQuickModal() {
  const im = quickImage();
  const blocker = quickBlocker(quickSettings(''), im);
  Q('#qp-imgs').innerHTML = quickChips();
  Q('#qp-img').textContent = im ? `${im.name} · ${fmtSz(im.downloadSize)} download · released ${im.releaseDate || '?'}` : '—';
  Q('#qp-warn').innerHTML = blocker ? `<div class="fp-warn">${esc(blocker)}</div>` : '';
  Q('#mk').disabled = !!blocker || !HOSTNAME_RE.test(Q('#qp-host').value.trim());
}

function quickPiModal(dev) {
  return new Promise(resolve => {
    const s = quickSettings('');
    const skipped = (defaults.wifiNetworks || []).filter(w => w.ssid && !w.password).map(w => w.ssid);
    showModal(`<h3>⚡ Quick Pi</h3>
      <div class="modal-dev">${devLine(dev)}</div>
      <div class="fg"><label for="qp-host">Hostname</label>${hostInput('qp-host', '')}</div>
      <div class="qp-imgs" id="qp-imgs"></div>
      <div class="qp-sum">
        <span>Image</span><span id="qp-img"></span>
        <span>Login</span><span>${esc(s.username)} · ${s.sshKeys.length} SSH key${s.sshKeys.length === 1 ? '' : 's'} · no password${s.passwordlessSudo ? ' · passwordless sudo' : ''}</span>
        <span>Wi-Fi</span><span>${s.wifiNetworks.length ? esc(s.wifiNetworks.map(w => w.ssid).join(', ')) : 'none (wired)'}${skipped.length ? ` <span class="dim">· skipped ${esc(skipped.join(', '))}: no saved password, re-save defaults with it</span>` : ''}</span>
        <span>Locale</span><span>${esc(s.timezone)} · ${esc(s.keyboardLayout)} keyboard</span>
      </div>
      <div id="qp-warn"></div>
      <div class="modal-btns"><button class="btn" id="qp-more" style="margin-right:auto">More options…</button><button class="btn" id="mc">Cancel</button><button class="btn btn-primary" id="mk" disabled>Flash</button></div>`);
    const host = Q('#qp-host');
    const ok = () => !quickBlocker(quickSettings(''), quickImage()) && HOSTNAME_RE.test(host.value.trim());
    wireHost(host, Q('#mk'), ok);
    renderQuickModal();
    host.focus();
    Q('#mc').onclick = () => { hideModal(); resolve(null); };
    Q('#qp-more').onclick = () => { const h = host.value.trim(); hideModal(); resolve(null); flashDrive(dev, h); };
    Q('#mk').onclick = () => { if (ok()) { hideModal(); resolve(flashRequest(quickImage(), dev, quickSettings(host.value.trim()))); } };
    Q('#modal-bg').onclick = e => { if(e.target===Q('#modal-bg')){hideModal();resolve(null);} };
  });
}

function flashModal(dev, hostname) {
  return new Promise(resolve => {
    let last; try { last = localStorage.getItem('flashLast'); } catch {}
    const lastIm = imgByKey(last);
    fp = { dev, sel: lastIm?.key || null, tab: lastIm && !lastIm.rpios ? 'other' : 'rpios', distro: lastIm && !lastIm.rpios ? distroOf(lastIm) : null, q: '' };

    const d = defaults;
    const savedKeys = Array.isArray(d.sshKeys) ? d.sshKeys.join('\n') : '';

    showModal(`<h3>Flash Image</h3>
      <div class="modal-dev">${devLine(dev)}</div>
      <div class="qp-bar">
        <span class="qp-title" title="Flash the chosen image with the saved defaults; only the hostname is asked">⚡ Quick Pi</span>
        <span class="qp-imgs" id="qpb-imgs"></span>
        ${hostInput('qpb-host', '')}
        <button class="btn btn-primary btn-sm" id="qpb-go" disabled>Flash</button>
      </div>
      <div id="fp-favs"></div>
      <div class="fp-bar"><div class="fp-tabs" id="fp-tabs"></div><div class="fp-boards" id="fp-boards"></div></div>
      <div id="fp-body"></div>
      <div id="fp-sel"></div>
      <div class="fg fp-host"><label for="sf-host">Hostname</label>${hostInput('sf-host', hostname || d.hostname || 'raspberrypi')}</div>
      <details><summary>More settings</summary>
        <div class="settings-grid">
          <div class="fg"><label>Username</label><input type="text" id="sf-user" value="${esc(d.username||'pi')}"></div>
          <div class="fg"><label>Password</label><input type="password" id="sf-pass" placeholder="Blank = key-only SSH"></div>
          <div class="fg full"><div class="check"><input type="checkbox" id="sf-ssh" ${d.enableSsh!==false?'checked':''}><label for="sf-ssh">Enable SSH</label></div><div class="check"><input type="checkbox" id="sf-sudo" ${d.passwordlessSudo?'checked':''}><label for="sf-sudo">Passwordless sudo</label></div></div>
          <div class="fg full"><label>SSH Authorized Keys</label><textarea id="sf-keys" rows="3" placeholder="ssh-ed25519 AAAA... user@host (one per line)" style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 10px;color:var(--text);font-size:.8rem;font-family:'SF Mono',ui-monospace,monospace;resize:vertical;outline:none;width:100%">${esc(savedKeys)}</textarea></div>
          <div class="fg full" style="margin-top:8px">
            <label>WiFi Networks</label>
            <div id="wifi-list" style="display:flex;flex-direction:column;gap:6px"></div>
            <button class="btn btn-sm" onclick="addWifiRow('','','US')" type="button" style="margin-top:6px">+ Add WiFi Network</button>
          </div>
          <div class="fg"><label>Timezone</label><input type="text" id="sf-tz" value="${esc(d.timezone||'UTC')}"></div>
          <div class="fg"><label>Keyboard</label><input type="text" id="sf-kb" value="${esc(d.keyboardLayout||'us')}"></div>
          <div class="fg full" style="justify-content:flex-end"><button class="btn btn-sm" onclick="saveDefaults()" type="button">Save as Default</button></div>
        </div>
      </details>
      <div class="modal-btns"><button class="btn" id="mc">Cancel</button><button class="btn btn-primary" id="mk" disabled>Flash</button></div>`, 'wide flash');

    // Populate saved WiFi networks
    const nets = Array.isArray(d.wifiNetworks) ? d.wifiNetworks : [];
    for (const w of nets) addWifiRow(w.ssid, w.password||'', w.country||'US');
    if (nets.length === 0) addWifiRow('','','US');

    const close = r => { hideModal(); fp = null; resolve(r); };
    const qh = Q('#qpb-host');
    const quickOk = () => !quickBlocker(quickSettings(''), quickImage()) && HOSTNAME_RE.test(qh.value.trim());
    wireHost(qh, Q('#qpb-go'), quickOk);
    Q('#qpb-go').onclick = () => { if (quickOk()) close(flashRequest(quickImage(), dev, quickSettings(qh.value.trim()))); };
    Q('#sf-host').addEventListener('input', updateFlashBtn);

    Q('#mc').onclick = () => close(null);
    Q('#mk').onclick = () => {
      const im = imgByKey(fp?.sel);
      if (im && hostOk()) close(flashRequest(im, dev, readSettingsForm()));
    };
    Q('#modal-bg').onclick = e => { if (e.target === Q('#modal-bg')) close(null); };
    renderPicker();
  });
}

function hostOk() { const v = Q('#sf-host')?.value.trim() || ''; return !v || HOSTNAME_RE.test(v); }

function updateFlashBtn() {
  Q('#sf-host')?.classList.toggle('bad', !hostOk());
  if (Q('#mk')) Q('#mk').disabled = !imgByKey(fp?.sel) || !hostOk();
}

function fpSelect(key) { fp.sel = key; renderPicker(); }
function fpTab(tab) { fp.tab = tab; renderPicker(); }
function fpDistro(id) { fp.distro = id; fp.q = ''; renderPicker(); }
function fpPickFav(key) {
  const im = imgByKey(key);
  if (!im) return;
  fp.sel = key;
  if (im.rpios) fp.tab = 'rpios'; else { fp.tab = 'other'; fp.distro = distroOf(im); fp.q = ''; }
  renderPicker();
}
function fpSearch(q) {
  fp.q = q;
  renderPicker();
  const el = Q('#fp-q'); el.focus(); el.setSelectionRange(q.length, q.length);
}

function starBtn(key) {
  const on = inList('favorites', key);
  return `<span class="fp-star${on ? ' on' : ''}" onclick="toggleList('favorites', '${esc(key)}', event)" title="${on ? 'Remove from favorites' : 'Add to favorites'}">${on ? '★' : '☆'}</span>`;
}

// Only images that take first-boot settings can go on the Quick Pi list: it sets the hostname.
function quickBtn(im) {
  if (!takesSettings(im)) return '';
  const on = inList('quick', im.key);
  return `<span class="fp-qk${on ? ' on' : ''}" onclick="toggleList('quick', '${esc(im.key)}', event)" title="${on ? 'Remove from the Quick Pi list' : 'Add to the Quick Pi list'}">⚡</span>`;
}

function renderPicker() {
  if (!fp || !Q('#fp-body')) return;
  const board = curBoard();

  Q('#qpb-imgs').innerHTML = quickChips();
  const quickBlock = quickBlocker(quickSettings(''), quickImage());
  Q('#qpb-go').title = quickBlock;
  Q('#qpb-go').disabled = !!quickBlock || !HOSTNAME_RE.test(Q('#qpb-host').value.trim());

  const favorites = lists.favorites;
  Q('#fp-favs').innerHTML = favorites.length
    ? `<div class="fp-favs"><span class="fp-lbl">★ Favorites</span>${favorites.map(f => {
        const im = imgByKey(f.key);
        if (!im) return `<span class="fp-chip gone" title="Not in the current catalog">${esc(f.label)}<span class="x" onclick="toggleList('favorites', '${esc(f.key)}', event)" title="Remove">×</span></span>`;
        return `<span class="fp-chip${fp.sel === f.key ? ' sel' : ''}${fitsBoard(im, board) ? '' : ' off'}" onclick="fpPickFav('${esc(f.key)}')" title="${esc(im.name)}">${esc(f.label)}</span>`;
      }).join('')}</div>`
    : `<div class="fp-favs empty">☆ Star an image to pin it here.</div>`;

  Q('#fp-tabs').innerHTML = [['rpios', 'Raspberry Pi OS'], ['other', 'Other OSes']]
    .map(([t, l]) => `<button class="fp-tab${fp.tab === t ? ' on' : ''}" onclick="fpTab('${t}')">${l}</button>`).join('');
  Q('#fp-boards').innerHTML = `<label class="fp-lbl" for="fp-board">Board</label><select id="fp-board" onchange="setBoard(this.value)"><option value="">Any</option>${
    boards.map(b => `<option value="${esc(b.name)}" ${board === b ? 'selected' : ''}>${esc(boardShort(b.name))}</option>`).join('')}</select>`;

  Q('#fp-body').innerHTML = fp.tab === 'rpios' ? renderRpiOs(board) : renderDistros(board);
  renderSel(board);
  updateFlashBtn();
}

// Raspberry Pi OS as a grid: release × arch down the side, edition across the top.
function renderRpiOs(board) {
  const pios = images.filter(i => i.rpios);
  if (!pios.length) return `<div class="fp-empty">Raspberry Pi OS isn't in the catalog right now (offline?).</div>`;
  let h = `<table class="fp-rpios"><thead><tr><th></th>${RPIOS_EDITIONS.map(([, l, sub]) => `<th>${l}<small>${sub}</small></th>`).join('')}</tr></thead><tbody>`;
  for (const legacy of [false, true]) {
    for (const arch of ['64', '32']) {
      const row = pios.filter(i => i.rpios.legacy === legacy && i.rpios.arch === arch);
      if (!row.length) continue;
      h += `<tr><th><b>${esc(cap(row[0].rpios.release))}</b> ${arch}-bit${legacy ? ' <span class="fp-tag">legacy</span>' : ''}<small>${esc(imgBoards(row[0]).join(' · '))}</small></th>`;
      for (const [ed] of RPIOS_EDITIONS) {
        const im = row.find(i => i.rpios.edition === ed);
        if (!im) { h += `<td class="na">—</td>`; continue; }
        const cls = [fp.sel === im.key && 'sel', !fitsBoard(im, board) && 'off'].filter(Boolean).join(' ');
        h += `<td><div class="fp-cell ${cls}" onclick="fpSelect('${esc(im.key)}')" title="${esc(im.name)}">${starBtn(im.key)}${quickBtn(im)}<span class="sz">${fmtSz(im.downloadSize)}</span><span class="sub">${fmtSz(im.extractSize)} on disk</span></div></td>`;
      }
      h += '</tr>';
    }
  }
  return h + `</tbody></table><div class="fp-note">Released ${esc(pios[0].releaseDate)}. Legacy is the previous Debian release. Sizes are download / written.</div>`;
}

// Everything else: a distro menu on the left, that distro's images on the right.
function renderDistros(board) {
  const others = images.filter(i => !i.rpios && !(i.path[0] || '').startsWith('Raspberry Pi OS'));
  const q = fp.q.trim().toLowerCase();
  const match = im => !q || [im.name, im.description, ...im.path].some(s => s.toLowerCase().includes(q));
  const shown = others.filter(im => match(im) && fitsBoard(im, board));
  const hidden = others.filter(im => match(im) && !fitsBoard(im, board)).length;

  const ids = [...new Set(others.map(distroOf))];
  const count = id => shown.filter(im => distroOf(im) === id).length;
  const hasFav = id => others.some(im => distroOf(im) === id && inList('favorites', im.key));
  const popular = POPULAR_DISTROS.map(n => ids.find(id => distroName(id) === n)).filter(Boolean);
  if (!ids.includes(fp.distro)) fp.distro = popular.find(count) || ids[0];

  const item = id => {
    const n = count(id);
    return `<div class="fp-di${!q && fp.distro === id ? ' on' : ''}${n ? '' : ' off'}" onclick="fpDistro('${esc(id)}')"><span>${hasFav(id) ? '<span class="fp-star on">★</span> ' : ''}${esc(distroName(id))}</span><span class="n">${n}</span></div>`;
  };
  let side = `<input type="search" id="fp-q" class="fb-filter" placeholder="Search all images…" value="${esc(fp.q)}" oninput="fpSearch(this.value)">`;
  const commonShown = popular.filter(id => !q || count(id));
  if (commonShown.length) side += `<div class="fp-dgrp">Common</div>${commonShown.map(item).join('')}`;
  for (const grp of [...new Set(ids.map(distroGroup))]) {
    const inGrp = ids.filter(id => distroGroup(id) === grp && !popular.includes(id) && (!q || count(id)));
    if (inGrp.length) side += `<div class="fp-dgrp">${esc(grp)}</div>${inGrp.map(item).join('')}`;
  }

  const list = q ? shown : shown.filter(im => distroOf(im) === fp.distro);
  let main = `<table class="fp-imgs"><tbody>`;
  let group = null;
  for (const im of list) {
    // Search results span distros, so group by full path; a distro's own list only by
    // its sub-folders (Apertis has three).
    const g = (q ? im.path : im.path.slice(distroDepth(im))).join(' › ');
    if (g !== group) { group = g; if (g) main += `<tr class="grp"><td colspan="5">${esc(g)}</td></tr>`; }
    main += `<tr class="${fp.sel === im.key ? 'sel' : ''}" onclick="fpSelect('${esc(im.key)}')">
      <td class="st">${starBtn(im.key)}${quickBtn(im)}</td>
      <td class="nm"><div>${esc(im.name)}</div><div class="desc">${esc(im.description.replace(/<[^>]*>/g, ''))}</div></td>
      <td class="bd">${esc(imgBoards(im).join(' · ') || 'any')}</td>
      <td class="num">${fmtSz(im.downloadSize)}</td>
      <td class="fs">${takesSettings(im) ? '<span class="fp-ok" title="Hostname, user, SSH and Wi-Fi are applied on first boot">settings ✓</span>' : '<span class="fp-no" title="This image ignores the flash settings">no settings</span>'}</td>
    </tr>`;
  }
  if (!list.length) main += `<tr><td class="fp-empty" colspan="5">${q ? 'No images match.' : 'Nothing here for this board.'}</td></tr>`;
  main += '</tbody></table>';
  if (hidden) main += `<div class="fp-note">${hidden} more image${hidden === 1 ? '' : 's'} hidden: not for the ${esc(boardShort(board.name))}. <a onclick="setBoard('')">Show all boards</a></div>`;

  return `<div class="fp-distros"><div class="fp-side">${side}</div><div class="fp-main">${main}</div></div>`;
}

function renderSel(board) {
  const im = imgByKey(fp.sel);
  if (!im) { Q('#fp-sel').innerHTML = `<div class="fp-selbox none">Pick an image above.</div>`; return; }
  const drive = driveOf(fp.dev);
  const warns = [];
  if (!fitsBoard(im, board)) warns.push(`Not listed for the ${boardShort(board.name)}.`);
  if (!takesSettings(im)) warns.push(`This image ignores the settings below (first-boot setup: ${initFormatLabel(im.initFormat)}).`);
  if (drive && im.extractSize > drive.size) warns.push(`Needs ${fmtSz(im.extractSize)} but the drive is ${fmtSz(drive.size)}.`);
  Q('#fp-sel').innerHTML = `<div class="fp-selbox">
    <div class="t">${starBtn(im.key)} ${quickBtn(im)} <b>${esc(im.name)}</b> <span class="dim">${im.rpios ? '' : esc(im.path.join(' › '))}</span></div>
    <div class="dim">${esc(im.description.replace(/<[^>]*>/g, ''))}</div>
    <div class="dim">${fmtSz(im.downloadSize)} download · ${fmtSz(im.extractSize)} on disk · released ${esc(im.releaseDate || '?')} · ${esc(imgBoards(im).join(', ') || 'any board')} · settings via ${esc(initFormatLabel(im.initFormat))}</div>
    ${warns.map(w => `<div class="fp-warn">${esc(w)}</div>`).join('')}
  </div>`;
}

async function loadDefaults() {
  try {
    defaults = await (await fetch('/api/defaults')).json();
  } catch { defaults = {}; }
}

async function saveDefaults() {
  const s = readSettingsForm();
  // The login password isn't kept, but Wi-Fi passwords are: without them a saved network
  // is useless (Quick Pi leaves it out), and defaults.json only lives on this Pi.
  delete s.password;
  try {
    await fetch('/api/defaults', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(s) });
    toast('Defaults saved','success');
  } catch { toast('Save failed','error'); }
}

// How the chosen image takes first-boot settings (the catalog's init_format).
function initFormatLabel(f) {
  return { systemd: 'firstrun.sh', cloudinit: 'cloud-init', 'cloudinit-rpi': 'cloud-init', 'rpi-preseed': 'not supported (rpi-preseed)' }[f] || 'not supported by this image';
}

function readSettingsForm() {
  // Collect WiFi networks
  const wifiRows = document.querySelectorAll('.wifi-entry');
  const wifiNetworks = [];
  wifiRows.forEach((row, i) => {
    const ssid = row.querySelector('.wf-ssid')?.value || '';
    const password = row.querySelector('.wf-pass')?.value || '';
    const country = row.querySelector('.wf-cc')?.value || 'US';
    if (ssid) wifiNetworks.push({ ssid, password, country, priority: wifiRows.length - i });
  });

  // Collect SSH keys
  const keysRaw = Q('#sf-keys')?.value || '';
  const sshKeys = keysRaw.split('\n').map(k => k.trim()).filter(k => k.length > 0);

  return {
    hostname: Q('#sf-host')?.value||'raspberrypi',
    username: Q('#sf-user')?.value||'pi',
    password: Q('#sf-pass')?.value||'',
    enableSsh: Q('#sf-ssh')?.checked??true,
    passwordlessSudo: Q('#sf-sudo')?.checked??false,
    sshKeys,
    wifiNetworks,
    timezone: Q('#sf-tz')?.value||'UTC',
    keyboardLayout: Q('#sf-kb')?.value||'us',
  };
}

function addWifiRow(ssid, password, country) {
  const list = Q('#wifi-list');
  if (!list) return;
  const div = document.createElement('div');
  div.className = 'wifi-entry';
  div.innerHTML = `<input type="text" class="wf-ssid" placeholder="SSID" value="${esc(ssid||'')}">
    <input type="password" class="wf-pass" placeholder="Password" value="${esc(password||'')}">
    <input type="text" class="wf-cc" placeholder="CC" value="${esc(country||'US')}" style="width:50px">
    <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" type="button">&times;</button>`;
  list.appendChild(div);
}

// ==================== Modals ====================
function showModal(html, cls) {
  Q('#modal').className = 'modal' + (cls ? ' ' + cls : '');
  Q('#modal').innerHTML = html;
  Q('#modal-bg').classList.remove('hidden');
}
function hideModal() {
  Q('#modal-bg').classList.add('hidden');
  fb = null; fbSeq++; // drop any file-browser state and in-flight listing with it
  fp = null;
  maybeReload();
}

function confirm2(title, msg, devInfo) {
  return new Promise(resolve => {
    showModal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="modal-dev">${esc(devInfo).replace(/\n/g,'<br>')}</div>
      <div class="modal-btns"><button class="btn" id="mc">Cancel</button><button class="btn btn-primary" id="mk">Confirm</button></div>`);
    Q('#mc').onclick = () => { hideModal(); resolve(false); };
    Q('#mk').onclick = () => { hideModal(); resolve(true); };
    Q('#modal-bg').onclick = e => { if(e.target===Q('#modal-bg')){hideModal();resolve(false);} };
  });
}

function eraseModal(dev, model, size) {
  return new Promise(resolve => {
    showModal(`<h3 style="color:var(--danger)">Erase Device</h3>
      <p>Permanently destroy all data on:</p>
      <div class="modal-dev">${esc(model)}<br>/dev/${esc(dev)} · ${fmtSz(size)}</div>
      <div class="radio-group">
        <label><input type="radio" name="em" value="quick" checked> <strong>Quick</strong> — clear partition table (instant)</label>
        <label><input type="radio" name="em" value="full"> <strong>Full</strong> — write zeros (slow)</label>
        <label><input type="radio" name="em" value="discard"> <strong>Discard</strong> — TRIM for SSDs (fast)</label>
      </div>
      <div class="confirm-box"><label>Type ERASE to confirm:</label><input type="text" id="ec" autocomplete="off"></div>
      <div class="modal-btns"><button class="btn" id="mc">Cancel</button><button class="btn btn-danger" id="mk" disabled>Erase</button></div>`);
    Q('#ec').addEventListener('input', () => { Q('#mk').disabled = Q('#ec').value !== 'ERASE'; });
    Q('#ec').focus();
    Q('#mc').onclick = () => { hideModal(); resolve(null); };
    Q('#mk').onclick = () => { if(Q('#ec').value!=='ERASE') return; hideModal(); resolve(document.querySelector('input[name="em"]:checked').value); };
    Q('#modal-bg').onclick = e => { if(e.target===Q('#modal-bg')){hideModal();resolve(null);} };
  });
}

// ==================== Toast ====================
function toast(msg, type) {
  const c = Q('#toasts');
  const t = document.createElement('div');
  t.className = `toast toast-${type||'info'}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

// ==================== Peripherals ====================
// Each driver's ui/<id>.js calls periphRegister(id, { mount(el, st, S), update(st, S), unmount() }).
// mount() runs once when the section first appears and owns everything inside `el`;
// update() runs on every status push with S.peripherals.state[id]. A section is shown while
// its driver reports `active` (a device present, something running), or after the user
// opens it from the Tools strip. Idle sections fold away into that strip.
const PERIPH = {};
const periphMounted = {};
let periphOpen = new Set();
try { periphOpen = new Set(JSON.parse(localStorage.getItem('periphOpen') || '[]')); } catch {}
function periphRegister(id, def) { PERIPH[id] = def; if (S) renderPeriph(S); }
function periphSaveOpen() { try { localStorage.setItem('periphOpen', JSON.stringify([...periphOpen])); } catch {} }
function periphShow(id) { periphOpen.add(id); periphSaveOpen(); renderPeriph(S); Q('#pr-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function periphHide(id) { periphOpen.delete(id); periphSaveOpen(); renderPeriph(S); }

function renderPeriph(s) {
  const P = s?.peripherals; if (!P) return;
  const host = Q('#periph');
  const order = P.list.map(d => d.id);
  const idle = [];
  for (const d of P.list) {
    const def = PERIPH[d.id];
    const st = P.state[d.id];
    const show = def && !d.disabled && st && (d.active || periphOpen.has(d.id));
    let sec = Q('#pr-' + d.id);
    if (!show) {
      if (sec) { try { def?.unmount?.(); } catch (e) { console.error(e); } sec.remove(); delete periphMounted[d.id]; }
      if (def && !d.disabled && st) idle.push(d);
      continue;
    }
    if (!sec) {
      sec = document.createElement('div');
      sec.className = 'section pr-sec'; sec.id = 'pr-' + d.id;
      sec.innerHTML = `<div class="section-title"><span>${esc(d.title)}</span><span class="pr-sum"></span><button class="pr-x" aria-label="Fold into Tools" onclick="periphHide('${d.id}')">&times;</button></div><div class="pr-body"></div>`;
      // Keep driver order stable regardless of when each section appeared.
      const mine = order.indexOf(d.id);
      const after = [...host.children].find(c => order.indexOf(c.id.slice(3)) > mine);
      host.insertBefore(sec, after || null);
    }
    sec.querySelector('.pr-sum').textContent = d.summary || '';
    // Only idle sections the user opened can be folded; an active one would just come back.
    sec.querySelector('.pr-x').style.visibility = d.active ? 'hidden' : 'visible';
    try {
      if (!periphMounted[d.id]) { periphMounted[d.id] = true; def.mount?.(sec.querySelector('.pr-body'), st, s); }
      def.update?.(st, s);
    } catch (e) { console.error(`[${d.id}]`, e); }
  }
  const tools = Q('#periph-tools');
  const sig = idle.map(d => d.id + ':' + d.summary).join('|');
  if (tools.dataset.sig !== sig) {
    tools.dataset.sig = sig;
    tools.innerHTML = `<div class="pr-tools"><span class="pr-lbl">Tools</span>${idle.map(d => `<button class="pr-tool" onclick="periphShow('${d.id}')">${esc(d.title)}${d.summary ? `<small>${esc(d.summary)}</small>` : ''}</button>`).join('')}<button class="btn btn-sm pr-gear" onclick="periphSettings()">Peripherals…</button></div>`;
  }
}

function periphSettings() {
  const list = S?.peripherals?.list || [];
  showModal(`<h3>Peripherals</h3><p class="pr-note">Turn off anything you don't use. A disabled peripheral releases its devices, stops its bridges and captures, and disappears from the dashboard, the API and MCP.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">${list.map(d => `<label style="display:flex;gap:8px;align-items:flex-start;font-size:.85rem"><input type="checkbox" ${d.disabled ? '' : 'checked'} onchange="periphToggle('${d.id}', !this.checked)"><span><b>${esc(d.title)}</b>${d.description ? `<br><span class="pr-note">${esc(d.description)}</span>` : ''}</span></label>`).join('')}</div>
    <div class="modal-btns"><button class="btn" onclick="hideModal()">Done</button></div>`);
}
async function periphToggle(id, disabled) {
  try { await papi('POST', '/api/periph/driver', { id, disabled }); } catch {}
}

// JSON fetch for driver UIs: resolves the parsed body; toasts and throws on failure.
async function papi(method, url, body) {
  let r, j;
  try {
    r = await fetch(url, { method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
    j = await r.json().catch(() => ({}));
  } catch (e) { toast('Request failed: ' + e.message, 'error'); throw e; }
  if (!r.ok || j.ok === false) { const m = j.message || r.statusText; toast(m, 'error'); throw new Error(m); }
  return j;
}

// Reconnecting WebSocket for driver UIs. Text messages arrive parsed as JSON when they are
// JSON; binary arrives as an ArrayBuffer. Returns { send(obj|string|ArrayBuffer), close(), ready }.
function pws(path, { onmessage, onopen, onclose } = {}) {
  let ws, closed = false, retry = 500;
  const open = () => {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + path);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { retry = 500; onopen?.(); };
    ws.onmessage = e => { let m = e.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch {} } onmessage?.(m); };
    ws.onclose = () => { onclose?.(); if (!closed) setTimeout(open, retry = Math.min(retry * 2, 8000)); };
  };
  open();
  return {
    send(m) { if (ws.readyState === 1) ws.send(typeof m === 'string' || m instanceof ArrayBuffer || ArrayBuffer.isView(m) ? m : JSON.stringify(m)); },
    close() { closed = true; ws.close(); },
    get ready() { return ws.readyState === 1; },
  };
}

function fmtAgo(ms) { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; }
function fmtHex(n, w = 2) { return '0x' + Number(n).toString(16).toUpperCase().padStart(w, '0'); }

// ==================== Init ====================
connect();
loadCatalog();
loadDefaults();
loadLists();
</script>
