<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskyPi</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e13;--surface:#151820;--surface2:#1c2030;--surface3:#242838;
  --border:#2a2f40;--text:#e1e4ed;--dim:#7a7f94;--accent:#6c8cff;
  --danger:#ff5c5c;--success:#4caf7d;--warning:#f5a623;--radius:8px;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent);text-decoration:none}
header{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:4px 20px;
  padding:14px 24px;border-bottom:1px solid var(--border);
  background:var(--surface);position:sticky;top:0;z-index:10;
}
header h1{font-size:1.15rem;font-weight:700;letter-spacing:-.5px}
.hdr-id{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.hdr-board{font-size:.82rem;color:var(--dim)}
.hdr-right{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:.82rem;color:var(--dim)}
.hdr-right b{color:var(--text);font-weight:600}
.hdr-warn{color:var(--warning)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
.dot.off{background:var(--danger)}
main{padding:20px 24px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Host power warning */
.power-banner{border-radius:var(--radius);padding:10px 16px;font-size:.85rem;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.power-banner.now{background:rgba(255,92,92,.12);border-color:var(--danger);color:#ffb3b3}
.power-banner.past{background:rgba(245,166,35,.1);border-color:var(--warning);color:#ffd591}
.power-banner strong{color:var(--text)}
.power-banner.hidden{display:none}
.section.hidden{display:none}
.power-banner .pb-icon{font-size:1.1rem;line-height:1.3}
.power-banner .pb-sub{color:var(--dim);font-size:.78rem;margin-top:2px}

/* Sections */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section-title{
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--dim);padding:14px 18px 10px;
}

/* Status grid */
/* Network needs more room than CPU & Memory: two sparkline+rate columns plus the interface */
.status-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:1px;background:var(--border)}
.status-grid>*{background:var(--surface);padding:14px 18px}
@media(max-width:860px){.status-grid{grid-template-columns:minmax(0,1fr)}}
.stat-label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:6px}
.stat-val{font-family:'SF Mono',ui-monospace,monospace;font-size:.88rem}
.stat-sub{font-size:.75rem;color:var(--dim);margin-top:2px}
.stat-row{display:flex;gap:20px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column}
.mono{font-family:'SF Mono',ui-monospace,monospace}

/* Network table */
.net-tbl{width:100%;border-collapse:collapse;font-size:.82rem;font-family:'SF Mono',ui-monospace,monospace;table-layout:fixed}
.net-tbl th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:4px 8px;border-bottom:1px solid var(--border)}
.net-tbl td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.net-tbl tr:last-child td{border-bottom:none}
.net-name{font-weight:600;font-size:.85rem}
.net-badge{font-size:.62rem;padding:2px 0;border-radius:3px;font-weight:600;text-transform:uppercase;display:inline-block;width:28px;text-align:center}
.net-badge.UP{background:#1e3a2f;color:var(--success)}
.net-badge.DOWN{background:#3a1a1a;color:var(--danger)}
.net-tbl td.net-if,.net-tbl th{overflow:hidden;text-overflow:ellipsis}
.net-ip{display:block;color:var(--dim);font-size:.72rem;overflow:hidden;text-overflow:ellipsis}
.net-bw{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px}
.net-bw .spark-fit{flex:1 1 70px;min-width:0;max-width:140px}
.net-bw span{flex-shrink:0;margin-left:auto;font-size:.68rem;min-width:62px;text-align:right}
.bw-rx{color:#6cb4ee}.bw-tx{color:#ee8a6c}
/* Tooltip */
.tip-trigger{cursor:default;border-bottom:1px dashed var(--border)}
.tooltip{
  position:fixed;z-index:50;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px 0;min-width:200px;max-width:340px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:.75rem;
  opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;pointer-events:none;
  font-family:'SF Mono',ui-monospace,monospace;
}
.tooltip.show{opacity:1;transform:translateY(0);pointer-events:auto}
.tip-row{display:flex;justify-content:space-between;align-items:center;padding:3px 12px;gap:12px;cursor:pointer;transition:background .1s}
.tip-row:hover{background:var(--surface3)}
.tip-label{color:var(--dim);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.tip-val{color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip-sep{border-top:1px solid var(--border);margin:4px 0}
.tip-copied{position:absolute;right:12px;top:6px;font-size:.6rem;color:var(--success);opacity:0;transition:opacity .2s}
.tip-copied.show{opacity:1}

.wifi-info{font-size:.72rem;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:10px}

/* Root device (collapsible) */
.root-toggle{
  width:100%;background:none;border:none;border-top:1px solid var(--border);
  padding:12px 18px;color:var(--dim);font-size:.82rem;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:8px;font-family:inherit;
}
.root-toggle:hover{background:var(--surface2)}
.root-toggle .arrow{transition:transform .2s;font-size:.7rem}
.root-toggle.open .arrow{transform:rotate(90deg)}
.root-detail{border-top:1px solid var(--border);padding:14px 18px;display:none}
.root-detail.open{display:block}
.root-parts{display:flex;flex-direction:column;gap:4px;margin-top:8px}

/* Sparkline histograms */
.spark-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.spark-box{display:flex;flex-direction:column;gap:2px}
.spark-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.spark-val{font-family:'SF Mono',ui-monospace,monospace;font-size:.88rem;font-weight:700}
.spark-lbl{font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
/* Stretch a sparkline to its container instead of its drawn width */
.spark-fit svg{width:100%}

/* USB adapters table */
.adapter-tbl{width:100%;border-collapse:collapse;font-size:.82rem;table-layout:fixed}
.adapter-tbl th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--border)}
.adapter-tbl td{padding:6px 8px;border-bottom:1px solid var(--border)}
.adapter-tbl tr:last-child td{border-bottom:none}
.adapter-name{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.adapter-link{color:var(--accent);cursor:pointer;font-family:'SF Mono',ui-monospace,monospace;font-size:.78rem}
.adapter-link:hover{text-decoration:underline}
.adapter-none{color:var(--dim);font-style:italic;font-size:.78rem}

/* Drive highlight animation */
@keyframes driveHighlight{0%{box-shadow:0 0 0 2px var(--accent)}50%{box-shadow:0 0 12px 3px var(--accent)}100%{box-shadow:none}}
.drive-card.highlight{animation:driveHighlight 1.5s ease-out}

/* Drive cards */
.drive-card{border-bottom:1px solid var(--border);padding:18px}
.drive-card:last-child{border-bottom:none}
.drive-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drive-info{flex:1;min-width:0}
.drive-model{font-weight:600;font-size:.95rem;display:block}
.drive-meta{font-size:.78rem;color:var(--dim);font-family:'SF Mono',ui-monospace,monospace;display:block;margin-top:2px}
.drive-bw{display:flex;gap:16px;margin-top:6px;font-size:.78rem;font-family:'SF Mono',ui-monospace,monospace}
.parts{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.part{
  background:var(--surface2);border-radius:5px;padding:8px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:.82rem;
}
.part-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.part-name{font-weight:600;font-family:'SF Mono',ui-monospace,monospace;flex-shrink:0}
.part-info{color:var(--dim);font-size:.75rem;font-family:'SF Mono',ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:4px;flex-shrink:0}
.badge{font-size:.6rem;padding:2px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-nbd{background:#3b3866;color:#a78bfa}
.badge-nfs{background:#1e3a2f;color:#6ee7b7}

/* Operation inline */
.drive-op{margin-top:10px;background:var(--surface3);border-radius:6px;padding:10px 14px}
.op-row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem}
.op-type{font-weight:600;text-transform:capitalize}
.op-msg{color:var(--dim);font-size:.78rem;margin-top:3px}
.op-bar{height:5px;background:var(--surface);border-radius:3px;margin-top:6px;overflow:hidden}
.op-fill{height:100%;border-radius:3px;transition:width .5s}
.op-fill.active{background:var(--accent)}
.op-fill.done{background:var(--success)}
.op-fill.error{background:var(--danger)}
.op-queued{margin-top:6px;font-size:.75rem;color:var(--dim);font-style:italic}

/* Actions bar */
.drive-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{
  padding:6px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:.78rem;font-weight:500;
  cursor:pointer;transition:all .15s;font-family:inherit;
}
.btn:hover:not(:disabled){background:var(--surface3);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:#5a7ae6}
.btn-danger{border-color:#5c2020;color:var(--danger)}
.btn-danger:hover:not(:disabled){background:#3a1a1a;border-color:var(--danger)}
.btn-warn{border-color:#5c4a10;color:var(--warning)}
.btn-warn:hover:not(:disabled){background:#3a3010;border-color:var(--warning)}
.btn-sm{padding:4px 10px;font-size:.72rem}
.empty{padding:28px 18px;text-align:center;color:var(--dim);font-size:.88rem}
.empty-sub{font-size:.78rem;margin-top:4px}
.no-parts{font-size:.82rem;color:var(--dim);margin-top:8px;font-style:italic}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:90%;max-width:460px;padding:24px}
.modal h3{font-size:1.05rem;margin-bottom:10px}
.modal p{color:var(--dim);font-size:.88rem;margin-bottom:14px;white-space:pre-line}
.modal-dev{background:var(--surface2);border-radius:6px;padding:10px 14px;font-family:'SF Mono',ui-monospace,monospace;font-size:.82rem;margin-bottom:14px}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.radio-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.radio-group label{display:flex;align-items:center;gap:8px;font-size:.85rem;cursor:pointer}
.radio-group input{accent-color:var(--accent)}
.confirm-box{margin-top:10px}
.confirm-box>label{font-size:.75rem;color:var(--danger);font-weight:600;display:block;margin-bottom:4px}
.confirm-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none}
.confirm-box input:focus{border-color:var(--accent)}

/* Flash modal form */
.flash-form{display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:.7rem;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fg select,.fg input[type="text"],.fg input[type="password"]{
  background:var(--surface2);border:1px solid var(--border);border-radius:5px;
  padding:7px 10px;color:var(--text);font-size:.85rem;font-family:inherit;outline:none;
}
.fg select:focus,.fg input:focus{border-color:var(--accent)}
.img-detail{font-size:.72rem;color:var(--dim)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.settings-grid .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:6px;font-size:.85rem}
.check input{accent-color:var(--accent);width:15px;height:15px}
details summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--accent);padding:6px 0;user-select:none}
details[open] summary{margin-bottom:8px}
.dim{color:var(--dim)}
.fg input.bad{border-color:var(--danger)}

/* Flash picker */
.modal.flash{display:flex;flex-direction:column;gap:12px}
.modal.flash>h3,.modal.flash>.modal-dev,.modal.flash>.modal-btns,.modal.flash details[open] summary{margin:0}
.modal.flash>details>.settings-grid{margin-top:8px}
.qp-bar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:9px 12px;border:1px solid #2d3a66;border-radius:8px;background:linear-gradient(90deg,#1a2240,var(--surface2));font-size:.8rem}
.qp-bar .qp-title{font-weight:700}
.qp-bar input{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px 9px;color:var(--text);font-size:.82rem;font-family:inherit;outline:none}
.qp-bar input:focus{border-color:var(--accent)}
.qp-bar input.bad{border-color:var(--danger)}
.qp-sum{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 4px;font-size:.8rem}
.qp-sum>:nth-child(odd){color:var(--dim);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.fp-favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem}
.fp-favs.empty{color:var(--dim);font-size:.74rem}
.fp-lbl{font-size:.66rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.fp-chip{padding:3px 10px;border-radius:12px;border:1px solid #5c4a10;background:#2a2410;color:#f5d27a;cursor:pointer;user-select:none}
.fp-chip:hover{border-color:var(--warning)}
.fp-chip.sel{background:var(--warning);color:#1a1405;border-color:var(--warning);font-weight:600}
.fp-chip.off{opacity:.45}
.fp-chip.gone{border-style:dashed;color:var(--dim);background:none;cursor:default;text-decoration:line-through}
.fp-chip .x{margin-left:6px;cursor:pointer;text-decoration:none;display:inline-block}
.fp-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.fp-tabs{display:flex;gap:2px}
.fp-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.fp-tab:hover{color:var(--text)}
.fp-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.fp-boards{display:flex;align-items:center;gap:6px;padding-bottom:5px}
.fp-boards select{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:3px 6px;color:var(--text);font-size:.78rem;font-family:inherit;outline:none}
.fp-star{cursor:pointer;color:var(--dim);font-size:.95rem;line-height:1;user-select:none}
.fp-star:hover{color:#f5d27a}
.fp-star.on{color:var(--warning)}
.fp-tag{display:inline-block;font-size:.6rem;padding:0 5px;border-radius:3px;background:var(--surface3);color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;vertical-align:1px}
.fp-note{font-size:.72rem;color:var(--dim);margin-top:6px}
.fp-note a{cursor:pointer}
.fp-empty{padding:20px;text-align:center;color:var(--dim);font-size:.82rem}
.fp-warn{color:var(--warning);font-size:.76rem;margin-top:4px}
.fp-warn::before{content:'⚠️ '}
.fp-rpios{width:100%;border-collapse:separate;border-spacing:6px;margin:0 -6px;font-size:.8rem}
.fp-rpios thead th{font-weight:700;text-align:center;padding-bottom:0}
.fp-rpios th small{display:block;font-weight:400;color:var(--dim);font-size:.68rem}
.fp-rpios tbody th{text-align:left;font-weight:400;white-space:nowrap;padding-right:6px;width:1%}
.fp-rpios td.na{text-align:center;color:var(--dim)}
.fp-cell{position:relative;display:flex;flex-direction:column;align-items:center;padding:9px 6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);cursor:pointer;transition:border-color .12s,background .12s}
.fp-cell:hover{border-color:var(--accent)}
.fp-cell.sel{border-color:var(--accent);background:#1e2a52;box-shadow:0 0 0 1px var(--accent) inset}
.fp-cell.off{opacity:.35}
.fp-cell .sz{font-weight:600;font-family:'SF Mono',ui-monospace,monospace;font-size:.8rem}
.fp-cell .sub{font-size:.66rem;color:var(--dim)}
.fp-cell .fp-star{position:absolute;top:4px;right:6px}
.fp-qk{cursor:pointer;font-size:.8rem;line-height:1;user-select:none;filter:grayscale(1);opacity:.3}
.fp-qk:hover{opacity:.7}
.fp-qk.on{filter:none;opacity:1}
.fp-cell .fp-qk{position:absolute;top:4px;left:6px}
.fp-imgs .st .fp-qk{margin-left:4px}
.qp-imgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.modal .qp-imgs#qp-imgs{margin-top:10px}
.fp-chip.qk{border-color:#2d3a66;background:#1a2240;color:#b9c8ff}
.fp-chip.qk:hover{border-color:var(--accent)}
.fp-chip.qk.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.fp-distros{display:grid;grid-template-columns:200px 1fr;gap:10px;height:min(46vh,430px)}
.fp-side{overflow:auto;border-right:1px solid var(--border);padding-right:8px}
.fp-side .fb-filter{margin-bottom:4px}
.fp-dgrp{font-size:.6rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:8px 0 2px;padding:0 6px}
.fp-di{display:flex;justify-content:space-between;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:.8rem}
.fp-di:hover{background:var(--surface2)}
.fp-di.on{background:var(--surface3);color:var(--text);font-weight:600}
.fp-di.off{opacity:.4}
.fp-di .n{color:var(--dim);font-size:.7rem;font-family:'SF Mono',ui-monospace,monospace}
.fp-main{overflow:auto}
.fp-imgs{width:100%;border-collapse:collapse;font-size:.8rem}
.fp-imgs td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.fp-imgs tr:not(.grp){cursor:pointer}
.fp-imgs tr:not(.grp):hover{background:var(--surface2)}
.fp-imgs tr.sel{background:#1e2a52!important;box-shadow:2px 0 0 var(--accent) inset}
.fp-imgs tr.grp td{font-size:.62rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:10px}
.fp-imgs .st{width:20px;white-space:nowrap}
.fp-imgs .nm .desc{font-size:.7rem;color:var(--dim);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.fp-imgs .bd{font-size:.7rem;color:var(--dim);white-space:nowrap}
.fp-imgs .num{text-align:right;font-family:'SF Mono',ui-monospace,monospace;color:var(--dim);font-size:.74rem;white-space:nowrap}
.fp-ok,.fp-no{font-size:.66rem;padding:1px 6px;border-radius:3px;white-space:nowrap}
.fp-ok{background:#16301f;color:var(--success)}
.fp-no{background:var(--surface3);color:var(--dim)}
.fp-selbox{border:1px solid var(--border);border-radius:7px;padding:9px 12px;background:var(--surface2);font-size:.78rem;display:flex;flex-direction:column;gap:2px}
.fp-selbox.none{color:var(--dim);text-align:center}
.fp-selbox .t{font-size:.86rem}
@media (max-width:640px){.fp-distros{grid-template-columns:1fr;height:auto}.fp-side{max-height:30vh;border-right:none}.fp-imgs .bd,.fp-imgs .fs{display:none}.fp-rpios{border-spacing:4px;margin:0 -4px}.fp-rpios tbody th{white-space:normal}.fp-rpios tbody th small,.fp-cell .sub{display:none}.fp-cell{padding:16px 2px 8px}.fp-cell .sz{font-size:.72rem}}

/* WiFi entries */
.wifi-entry{display:flex;gap:6px;align-items:center}
.wifi-entry input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--text);font-size:.82rem;font-family:inherit;outline:none}

<body>

<header>
  <div class="hdr-id">
    <h1 id="title">DeskyPi</h1>
    <span class="hdr-board" id="hdr-board"></span>
  </div>
  <div class="hdr-right">
    <span id="hdr-storage"></span>
    <span class="mono" id="hdr-ip"></span>
    <span id="uptime"></span>
    <span id="dot" class="dot"></span>
  </div>
</header>

<main>
  <div id="power-banner" class="power-banner hidden"></div>

  <!-- ====== SYSTEM STATUS ====== -->
  <div class="section">
    <div class="section-title">System Status</div>
    <div class="status-grid">
      <div>
        <div class="stat-label">CPU &amp; Memory</div>
        <div class="spark-row">
          <div class="spark-box" style="flex:1;min-width:120px">
            <div class="spark-hdr"><span class="spark-lbl">CPU</span><span class="spark-val" id="cpu-val">--</span></div>
            <div id="cpu-spark" class="spark-fit"></div>
            <div class="stat-sub" id="cpu-temp"></div>
          </div>
          <div class="spark-box" style="flex:1;min-width:120px">
            <div class="spark-hdr"><span class="spark-lbl">RAM</span><span class="spark-val" id="mem-val">--</span></div>
            <div id="mem-spark" class="spark-fit"></div>
            <div class="stat-sub" id="mem-detail"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="stat-label">Network</div>
        <table class="net-tbl" id="net-info"><tbody></tbody></table>
      </div>
    </div>
    <div id="usb-adapters" style="padding:12px 18px;border-top:1px solid var(--border)">
      <div class="stat-label">USB Adapters</div>
      <table class="adapter-tbl" id="adapter-list"><tbody></tbody></table>
    </div>
    <button class="root-toggle" id="root-toggle" onclick="toggleRoot()">
      <span class="arrow">&#9654;</span>
      <span id="root-summary">Root Device</span>
    </button>
    <div class="root-detail" id="root-detail"></div>
  </div>

  <!-- ====== USB BOOT MODE ====== -->
  <div class="section hidden" id="boot-section">
    <div class="section-title">USB Boot Mode</div>
    <div id="boot-devices"></div>
  </div>

  <!-- ====== CONNECTED DRIVES ====== -->
  <div class="section">
    <div class="section-title">Connected Drives</div>
    <div id="drives"><div class="empty">Connecting...</div></div>
  </div>

  <!-- ====== PERIPHERALS (sections built by ui/*.js) ====== -->
  <div id="periph" style="display:contents"></div>
  <div class="section" id="periph-tools"></div>
</main>

<div class="modal-bg hidden" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="tooltip" id="tooltip"></div>
<div class="toasts" id="toasts"></div>

<script>
let S = null; // current status
let images = [];
let defaults = {};
let es = null;

// ==================== Tooltip ====================
const tipEl = document.getElementById('tooltip');
let tipTimer = null;
let tipLock = false;

function tipRow(label, val) {
  if (!val && val !== 0) return '';
  const v = String(val);
  return `<div class="tip-row" onclick="tipCopy('${esc(v.replace(/'/g, "\\'"))}', this)"><span class="tip-label">${esc(label)}</span><span class="tip-val">${esc(v)}</span></div>`;
}

function tipCopy(text, rowEl) {
  navigator.clipboard.writeText(text).then(() => {
    let ind = tipEl.querySelector('.tip-copied');
    if (!ind) {
      ind = document.createElement('div');
      ind.className = 'tip-copied';
      tipEl.appendChild(ind);
    }
    ind.textContent = 'copied';
    ind.classList.add('show');
    setTimeout(() => ind.classList.remove('show'), 800);
  });
}

function showTip(anchor, html) {
  tipEl.innerHTML = html;
  tipEl.classList.add('show');
  tipLock = false;
  const r = anchor.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = r.left, y = r.bottom + 6;
  if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
  if (y + th > window.innerHeight - 8) y = r.top - th - 6;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}

function hideTip() {
  tipTimer = setTimeout(() => { if (!tipLock) tipEl.classList.remove('show'); }, 200);
}

tipEl.addEventListener('mouseenter', () => { clearTimeout(tipTimer); tipLock = true; });
tipEl.addEventListener('mouseleave', () => { tipLock = false; tipEl.classList.remove('show'); });

function showNetTip(el, idx) {
  clearTimeout(tipTimer);
  const n = S?.network?.[idx];
  if (!n) return;
  let h = `<div style="padding:3px 12px 5px;font-weight:600;font-size:.82rem;color:var(--text)">${esc(n.name)}</div>`;
  h += '<div class="tip-sep"></div>';
  h += tipRow('IPv4', n.ip ? `${n.ip}/${n.prefix || '?'}` : null);
  h += tipRow('Gateway', n.gateway);
  h += tipRow('MAC', n.mac);
  h += tipRow('MTU', n.mtu);
  h += tipRow('Metric', n.metric);
  h += tipRow('State', n.state);
  if (n.ipv6 && n.ipv6.length) {
    h += '<div class="tip-sep"></div>';
    for (const a of n.ipv6) h += tipRow('IPv6', a);
    if (n.gateway6) h += tipRow('GW6', n.gateway6);
  }
  if (n.wifi) {
    h += '<div class="tip-sep"></div>';
    h += tipRow('SSID', n.wifi.ssid);
    h += tipRow('Signal', `${n.wifi.signal} dBm`);
    h += tipRow('Bitrate', n.wifi.bitrate);
  }
  h += `<div style="padding:3px 12px;font-size:.58rem;color:var(--dim);text-align:center;margin-top:2px">click any row to copy</div>`;
  showTip(el, h);
}

function showAdapterTip(el, name, id, bus, dev) {
  clearTimeout(tipTimer);
  let h = `<div style="padding:3px 12px 5px;font-weight:600;font-size:.82rem;color:var(--text);white-space:normal">${esc(name)}</div>`;
  h += '<div class="tip-sep"></div>';
  h += tipRow('ID', id);
  h += tipRow('Bus', bus);
  h += tipRow('Device', dev);
  h += `<div style="padding:3px 12px;font-size:.58rem;color:var(--dim);text-align:center;margin-top:2px">click any row to copy</div>`;
  showTip(el, h);
}

// ==================== Build Version / Auto-Reload ====================
// The dashboard is left open for hours, so a deploy would otherwise leave a stale page
// talking to a newer backend. The server stamps the page below with a hash covering
// every file that defines the build — index.html AND server.ts, since a server-only
// deploy changes the API without changing a byte of this page — and reports the current
// one in every status message.
const MY_BUILD_VERSION = '__BUILD_VERSION__';
let pendingReload = false;

function checkBuildVersion(serverVersion) {
  if (!serverVersion || pendingReload) return;
  // An unsubstituted placeholder means an older backend that doesn't stamp the page.
  if (MY_BUILD_VERSION.startsWith('__BUILD_')) return;
  if (serverVersion === MY_BUILD_VERSION) return;
  pendingReload = true;
  maybeReload();
}

function maybeReload() {
  if (!pendingReload) return;
  // Don't yank the page out from under a dialog the user is part-way through filling in;
  // hideModal() calls back here once it is dismissed.
  if (!Q('#modal-bg').classList.contains('hidden')) return;
  toast('New dashboard version — reloading', 'info');
  setTimeout(() => location.reload(), 1500);
}

// ==================== SSE ====================
function connect() {
  if (es) es.close();
  es = new EventSource('/api/events');
  Q('#dot').className = 'dot';
  let seeded = false;
  es.onmessage = e => { S = JSON.parse(e.data); if (!seeded && S.history) { seedHist(S.history); seeded = true; } checkBuildVersion(S.buildVersion); render(); };
  es.onerror = () => { Q('#dot').className = 'dot off'; es.close(); setTimeout(connect, 3000); };
}

function Q(s) { return document.querySelector(s); }
function QA(s) { return document.querySelectorAll(s); }
function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtSz(b) { b=Number(b); if(!b) return '0 B'; const u=['B','KB','MB','GB','TB']; const i=Math.min(Math.floor(Math.log(b)/Math.log(1024)),u.length-1); return (b/Math.pow(1024,i)).toFixed(i>0?1:0)+' '+u[i]; }
function fmtRate(b) { b=Number(b); if(!b||b<1) return '0 B/s'; const u=['B/s','KB/s','MB/s','GB/s']; const i=Math.min(Math.floor(Math.log(b)/Math.log(1024)),u.length-1); return (b/Math.pow(1024,i)).toFixed(i>0?1:0)+' '+u[i]; }
function fmtRam(mb) { return mb >= 1024 ? `${mb / 1024} GB` : `${mb} MB`; }
// "microSD 14.9 GB", "NVMe 476.9 GB", "Netboot 10.0.0.1:/srv/root"; rootfs fullness only once it's worth a warning
function fmtRootStorage(r) {
  if (!r) return '';
  let h = `<b>${esc(r.kind)}</b> ${r.kind === 'Netboot' ? esc(r.source) : r.size ? fmtSz(r.size) : esc(r.source)}`;
  if (r.usePercent >= 85) h += ` <span class="hdr-warn">${r.usePercent}% full</span>`;
  return h;
}
function fmtUp(s) { s=Math.floor(s); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return 'up '+(d?d+'d ':'')+(d||h?h+'h ':'')+m+'m'; }

// ==================== Sparkline Histogram ====================
const hist = {};
const HIST_N = 30;

function seedHist(serverHist) {
  if (!serverHist) return;
  for (const [k, v] of Object.entries(serverHist)) {
    if (Array.isArray(v)) hist[k] = v.slice(-HIST_N);
  }
}

function pushH(key, val) {
  if (!hist[key]) hist[key] = [];
  hist[key].push(val);
  if (hist[key].length > HIST_N) hist[key].shift();
}

function histMax(prefix) {
  let mx = 0;
  for (const [k, v] of Object.entries(hist)) {
    if (k.startsWith(prefix)) for (const val of v) if (val > mx) mx = val;
  }
  return mx || 1;
}

function sparkSvg(key, w, h, color, maxFixed) {
  const d = hist[key] || [];
  if (!d.length) return `<svg width="${w}" height="${h}"></svg>`;
  const mx = maxFixed || Math.max(...d, 0.001);
  const logMx = Math.log1p(mx);
  const bw = w / HIST_N;
  let bars = '';
  for (let i = 0; i < d.length; i++) {
    const bh = logMx > 0 ? Math.max(d[i] > 0 ? 1 : 0, (Math.log1p(d[i]) / logMx) * h) : 0;
    bars += `<rect x="${(HIST_N - d.length + i) * bw}" y="${h - bh}" width="${Math.max(bw - 0.5, 0.5)}" height="${bh}" fill="${color}" rx="0.5"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}

function sparkSvgLinear(key, w, h, color, maxFixed) {
  const d = hist[key] || [];
  if (!d.length) return `<svg width="${w}" height="${h}"></svg>`;
  const mx = maxFixed || Math.max(...d, 0.001);
  const bw = w / HIST_N;
  let bars = '';
  for (let i = 0; i < d.length; i++) {
    const bh = Math.max(d[i] > 0 ? 1 : 0, (d[i] / mx) * h);
    bars += `<rect x="${(HIST_N - d.length + i) * bw}" y="${h - bh}" width="${Math.max(bw - 0.5, 0.5)}" height="${bh}" fill="${color}" rx="0.5"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}

function memSparkSvg(w, h, color) {
  const d = hist['mem'] || [];
  if (!d.length) return `<svg width="${w}" height="${h}"></svg>`;
  const bw = w / HIST_N;
  let bars = '';
  for (let i = 0; i < d.length; i++) {
    const bh = Math.max(d[i] > 0 ? 1 : 0, (d[i] / 100) * h);
    bars += `<rect x="${(HIST_N - d.length + i) * bw}" y="${h - bh}" width="${Math.max(bw - 0.5, 0.5)}" height="${bh}" fill="${color}" opacity="0.7" rx="0.5"/>`;
  }
  // Delta overlay: scale deltas so the largest fills the full height
  let deltas = '';
  if (d.length > 1) {
    const dv = [];
    for (let i = 1; i < d.length; i++) dv.push(Math.abs(d[i] - d[i - 1]));
    const dMax = Math.max(...dv, 0.001);
    for (let i = 0; i < dv.length; i++) {
      const bh = Math.max(dv[i] > 0 ? 1 : 0, (dv[i] / dMax) * h);
      deltas += `<rect x="${(HIST_N - d.length + 1 + i) * bw}" y="${h - bh}" width="${Math.max(bw - 0.5, 0.5)}" height="${bh}" fill="#ff5c5c" opacity="0.8" rx="0.5"/>`;
    }
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}${deltas}</svg>`;
}

// Signal history is raw dBm (negative), so map a fixed -90..-30 dBm window onto the height
function wifiSparkSvg(w, h) {
  const d = hist['wifi'] || [];
  if (!d.length) return `<svg width="${w}" height="${h}"></svg>`;
  const bw = w / HIST_N;
  let bars = '';
  for (let i = 0; i < d.length; i++) {
    const bh = Math.max(1, Math.min(1, Math.max(0, (d[i] + 90) / 60)) * h);
    bars += `<rect x="${(HIST_N - d.length + i) * bw}" y="${h - bh}" width="${Math.max(bw - 0.5, 0.5)}" height="${bh}" fill="${wifiColor(d[i])}" rx="0.5"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}

function pctColor(pct) {
  if (pct < 60) return '#6c8cff';
  if (pct < 85) return '#f5a623';
  return '#ff5c5c';
}

function wifiColor(dbm) {
  if (dbm >= -50) return '#4caf7d';
  if (dbm >= -67) return '#6c8cff';
  if (dbm >= -75) return '#f5a623';
  return '#ff5c5c';
}

// ==================== Render ====================
function render() {
  const s = S; if (!s) return;
  Q('#title').textContent = s.hostname || 'DeskyPi';
  document.title = s.hostname || 'DeskyPi';
  Q('#uptime').textContent = fmtUp(s.uptime);
  Q('#hdr-board').textContent = s.system.model + (s.system.ramMB ? ` · ${fmtRam(s.system.ramMB)} RAM` : '');
  Q('#hdr-storage').innerHTML = fmtRootStorage(s.rootStorage);
  Q('#hdr-ip').textContent = s.network.find(n => n.ip)?.ip || '';

  // CPU & Memory sparklines
  pushH('cpu', s.system.cpuUsage);
  pushH('mem', s.system.memPercent);
  Q('#cpu-val').textContent = `${s.system.cpuUsage.toFixed(1)}%`;
  Q('#cpu-val').style.color = pctColor(s.system.cpuUsage);
  Q('#cpu-spark').innerHTML = sparkSvgLinear('cpu', 140, 28, pctColor(s.system.cpuUsage), 100);
  Q('#cpu-temp').textContent = `${s.system.cpuTemp.toFixed(1)}°C · ${s.system.cores} cores` + (s.power?.inputVolts ? ` · ${s.power.inputVolts.toFixed(2)} V in` : '');
  Q('#mem-val').textContent = `${s.system.memPercent}%`;
  Q('#mem-val').style.color = pctColor(s.system.memPercent);
  Q('#mem-spark').innerHTML = memSparkSvg(140, 28, pctColor(s.system.memPercent));
  const memUsed = s.system.memTotal - s.system.memAvailable;
  Q('#mem-detail').textContent = `${fmtSz(memUsed*1024)} / ${fmtSz(s.system.memTotal*1024)}`;
  renderPower(s.power);

  // Network (sorted by metric on server)
  for (const n of s.network) {
    pushH(`net:${n.name}:rx`, n.rxRate);
    pushH(`net:${n.name}:tx`, n.txRate);
    if (n.wifi) pushH('wifi', n.wifi.signal);
  }
  const netMax = histMax('net:');
  // Interface column takes whatever RX/TX leave; the sparklines shrink before the rates do
  let nh = '<colgroup><col style="width:42px"><col><col style="width:33%"><col style="width:33%"></colgroup><thead><tr><th></th><th>Interface</th><th>RX</th><th>TX</th></tr></thead><tbody>';
  for (let ni = 0; ni < s.network.length; ni++) {
    const n = s.network[ni];
    nh += `<tr>
      <td><span class="net-badge ${n.state}">${n.state === 'UP' ? 'Up' : 'Dn'}</span></td>
      <td class="net-if"><span class="net-name tip-trigger" onmouseenter="showNetTip(this,${ni})" onmouseleave="hideTip()">${esc(n.name)}</span>${n.ip ? `<span class="net-ip">${n.ip}</span>` : ''}</td>
      <td><div class="net-bw"><div class="spark-fit">${sparkSvg(`net:${n.name}:rx`, 70, 18, '#6cb4ee', netMax)}</div><span class="bw-rx">${fmtRate(n.rxRate)}</span></div></td>
      <td><div class="net-bw"><div class="spark-fit">${sparkSvg(`net:${n.name}:tx`, 70, 18, '#ee8a6c', netMax)}</div><span class="bw-tx">${fmtRate(n.txRate)}</span></div></td>
    </tr>`;
    if (n.wifi) {
      const dbm = n.wifi.signal;
      nh += `<tr><td colspan="4" style="padding:4px 8px 8px;white-space:normal">
        <div class="wifi-info">
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px">
            ${wifiSparkSvg(70, 18)}
            <span style="color:${wifiColor(dbm)};font-weight:600;font-size:.82rem">${dbm} dBm</span>
            <span>${esc(n.wifi.ssid)} · ${esc(n.wifi.bitrate)}</span>
          </div>
        </div>
      </td></tr>`;
    }
  }
  nh += '</tbody>';
  Q('#net-info').innerHTML = nh;

  // USB Adapters as table with drive links
  if (s.usbAdapters.length) {
    Q('#usb-adapters').style.display = '';
    let ah = '<colgroup><col style="width:55%"><col style="width:15%"><col style="width:30%"></colgroup><thead><tr><th>Device</th><th>ID</th><th>Connected Drive</th></tr></thead><tbody>';
    for (const a of s.usbAdapters) {
      const drive = s.drives.find(d => d.usbId === a.id);
      const driveCell = drive
        ? `<span class="adapter-link" onclick="scrollToDrive('${drive.name}')">${drive.name} — ${esc(drive.model || drive.name)} (${fmtSz(drive.size)})</span>`
        : '<span class="adapter-none">No disk</span>';
      ah += `<tr><td><span class="adapter-name tip-trigger" onmouseenter="showAdapterTip(this,${esc(JSON.stringify(a.name))},${esc(JSON.stringify(a.id))},${esc(JSON.stringify(a.bus))},${esc(JSON.stringify(a.device))})" onmouseleave="hideTip()">${esc(a.name)}</span></td><td class="mono" style="font-size:.72rem;color:var(--dim)">${a.id}</td><td>${driveCell}</td></tr>`;
    }
    ah += '</tbody>';
    Q('#adapter-list').innerHTML = ah;
  } else {
    Q('#usb-adapters').style.display = 'none';
  }

  // Root device
  Q('#root-toggle').style.display = s.rootDevice ? '' : 'none';
  if (!s.rootDevice) Q('#root-detail').classList.remove('open');
  if (s.rootDevice) {
    Q('#root-summary').textContent = `Root Device (${s.rootDevice.name} · ${fmtSz(s.rootDevice.size)})`;
    let rh = '';
    if (s.rootDevice.children) {
      rh = '<div class="root-parts">';
      for (const p of s.rootDevice.children) {
        rh += `<div class="part"><div class="part-left"><span class="part-name">${p.name}</span><span class="part-info">${fmtSz(p.size)} · ${p.fstype||'?'}${p.label?' · '+esc(p.label):''} → ${esc(p.mountpoint||'')}</span></div></div>`;
      }
      rh += '</div>';
    }
    Q('#root-detail').innerHTML = rh;
  }

  renderBootDevices(s);

  // Drives
  renderDrives(s.drives, s.nbdExports);

  renderPeriph(s);
}

// Under-voltage on this Pi browns out every USB drive (and any Compute Module) hanging
// off its ports, so it gets a banner rather than a footnote.
function renderPower(p) {
  const el = Q('#power-banner');
  const bad = p && (p.now.length || p.sinceBoot.length);
  el.classList.toggle('hidden', !bad);
  if (!bad) return;
  const live = p.now.length > 0;
  el.className = 'power-banner ' + (live ? 'now' : 'past');
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 120 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
  let sub = [];
  if (p.undervoltageEvents) sub.push(`${p.undervoltageEvents} under-voltage event${p.undervoltageEvents === 1 ? '' : 's'} since boot, last ${ago(p.lastUndervoltage)}`);
  if (p.inputVolts) sub.push(`input ${p.inputVolts.toFixed(2)} V`);
  sub.push(`get_throttled=${p.raw}`);
  const head = live
    ? `<strong>Host power problem now:</strong> ${esc(p.now.join(', '))}. The supply to this Pi is sagging, so USB drives and flashes may fail or corrupt.`
    : `<strong>Host power problems since boot:</strong> ${esc(p.sinceBoot.join(', '))}. Check the power supply and cable. Connected USB drives draw from the same supply.`;
  el.innerHTML = `<span class="pb-icon">⚡</span><div>${head}<div class="pb-sub">${esc(sub.join(' · '))}</div></div>`;
}

function toggleRoot() {
  const btn = Q('#root-toggle');
  const det = Q('#root-detail');
  btn.classList.toggle('open');
  det.classList.toggle('open');
}

const DRIVE_OP_NAMES = { blcard: 'Bootloader card' };

function renderDrives(drives, nbdExports) {
  const el = Q('#drives');
  if (!drives.length) {
    el.innerHTML = '<div class="empty">No USB storage devices connected<div class="empty-sub">Plug in a USB drive to get started</div></div>';
    return;
  }
  let h = '';
  for (const d of drives) { pushH(`drv:${d.name}:r`, d.readRate); pushH(`drv:${d.name}:w`, d.writeRate); ensureOsInfo(d); }
  const drvMax = histMax('drv:');
  for (const d of drives) {
    const ops = d.operations || [];
    const activeOp = ops.find(o => !['done','error','queued'].includes(o.status));
    const queuedOps = ops.filter(o => o.status === 'queued');
    const doneOps = ops.filter(o => o.status === 'done' || o.status === 'error');
    const busy = !!activeOp;
    const hasParts = d.hasPartitions;

    h += `<div class="drive-card" id="drive-${d.name}">
      <div class="drive-hdr">
        <div class="drive-info">
          <span class="drive-model">${esc(d.model || d.name)}</span>
          <span class="drive-meta">/dev/${d.name} · ${fmtSz(d.size)}${d.serial ? ' · S/N: '+esc(d.serial) : ''}${d.rev ? ' · FW: '+esc(d.rev) : ''}${d.usbVersion ? ' · '+esc(d.usbVersion) : ''}</span>
          ${driveOsHtml(d)}
        </div>
        <div class="drive-bw" style="display:flex;gap:10px;align-items:center">
          <div style="display:flex;align-items:center;gap:4px"><div style="flex-shrink:0;width:50px">${sparkSvg(`drv:${d.name}:r`, 50, 16, '#6cb4ee', drvMax)}</div><span class="bw-rx" style="font-size:.68rem;min-width:62px;text-align:right">R ${fmtRate(d.readRate)}</span></div>
          <div style="display:flex;align-items:center;gap:4px"><div style="flex-shrink:0;width:50px">${sparkSvg(`drv:${d.name}:w`, 50, 16, '#ee8a6c', drvMax)}</div><span class="bw-tx" style="font-size:.68rem;min-width:62px;text-align:right">W ${fmtRate(d.writeRate)}</span></div>
        </div>
      </div>`;

    // Partitions
    if (hasParts && d.children) {
      h += '<div class="parts">';
      for (const p of d.children) {
        const hasNbd = nbdExports.includes(p.name);
        const hasNfs = p.mountpoint && p.mountpoint.startsWith('/srv/nfs/');
        const fbRel = filesRel(p.mountpoint);
        const browse = fbRel !== null ? `<button class="btn btn-sm" onclick="openFiles(${esc(JSON.stringify(fbRel))})" title="Browse files on this partition (read-only)">Browse</button>` : '';
        const pi = osPart(d.name, p.name);
        const role = pi?.role ? `<span class="badge badge-role" title="${esc(pi.note || '')}">${esc(pi.role)}</span>` : '';
        const osTag = pi ? partOsLabel(pi) : null;
        const osBadge = osTag ? `<span class="badge badge-os">${esc(osTag)}</span>` : '';
        const note = pi?.note ? ` · ${esc(pi.note)}` : '';
        h += `<div class="part"><div class="part-left"><span class="part-name">${p.name}</span><span class="part-info">${fmtSz(p.size)} · ${p.fstype||'?'}${p.label?' · '+esc(p.label):''}${p.mountpoint?' → '+esc(p.mountpoint):''}${note}</span></div><div class="badges" style="align-items:center">${osBadge}${role}${hasNfs?'<span class="badge badge-nfs">NFS</span>':''}${hasNbd?'<span class="badge badge-nbd">NBD</span>':''}${browse}</div></div>`;
      }
      h += '</div>';
    } else if (!hasParts && !busy) {
      h += '<div class="no-parts">No partition table detected</div>';
    }

    // Active operation
    for (const op of ops.filter(o => !['queued'].includes(o.status))) {
      const cls = op.status === 'done' ? 'done' : op.status === 'error' ? 'error' : 'active';
      h += `<div class="drive-op">
        <div class="op-row"><span><span class="op-type">${DRIVE_OP_NAMES[op.type] || op.type}</span>${op.imageName ? ' · '+esc(op.imageName) : ''}</span>
        ${cls==='active'?`<button class="btn btn-sm btn-danger" onclick="cancelOp('${op.id}')">Cancel</button>`:''}</div>
        <div class="op-msg">${esc(op.message)}</div>
        <div class="op-bar"><div class="op-fill ${cls}" style="width:${op.progress}%"></div></div>
      </div>`;
    }

    // Queued operations
    for (const op of queuedOps) {
      h += `<div class="op-queued">⏳ ${DRIVE_OP_NAMES[op.type] || op.type} queued${op.imageName ? ': '+esc(op.imageName) : ''}</div>`;
    }

    // Action buttons
    const isErasing = activeOp?.type === 'erase';
    const isFlashing = activeOp?.type === 'flash';
    const hasQueued = queuedOps.length > 0;

    h += '<div class="drive-actions">';

    if (hasParts && !busy) {
      // Has partitions: show Backup
      h += `<button class="btn btn-primary" onclick="backupDrive('${d.name}')">Backup</button>`;
    }

    if (!hasParts && !busy) {
      // No partitions: show Flash
      h += `<button class="btn btn-primary" onclick="flashDrive('${d.name}')">Flash</button>`;
      h += `<button class="btn" onclick="quickPiDrive('${d.name}')" title="Flash an image from the Quick Pi list with the saved defaults; asks only for a hostname">⚡ Quick Pi</button>`;
      h += `<button class="btn" onclick="scanDrive('${d.name}')">Scan</button>`;
    }

    // Optimistic: allow queueing flash during erase
    if (isErasing && !hasQueued) {
      h += `<button class="btn btn-primary" onclick="flashDrive('${d.name}')">Flash (queue)</button>`;
      h += `<button class="btn" onclick="quickPiDrive('${d.name}')" title="Queue an image from the Quick Pi list with the saved defaults">⚡ Quick Pi (queue)</button>`;
    }

    // Raw-sector inspection: useful whether or not a filesystem claims to be empty
    if (!busy) {
      h += `<button class="btn" onclick="probeDrive('${d.name}')" title="Sample raw sectors across the device — fast">Probe</button>`;
      h += `<button class="btn" onclick="deepScanDrive('${d.name}','${esc(d.model||d.name)}',${d.size})" title="Read the whole device looking for file signatures">Deep Scan</button>`;
    }

    if (!busy) {
      h += `<button class="btn btn-warn" onclick="eraseDrive('${d.name}','${esc(d.model||d.name)}',${d.size})">Erase</button>`;
      h += `<button class="btn" onclick="blCardDrive('${d.name}')">Bootloader card…</button>`;
    }

    // Eject: disabled during any operation
    h += `<button class="btn" onclick="ejectDrive('${d.name}','${esc(d.model||d.name)}')" ${busy?'disabled':''}>Eject</button>`;

    h += '</div></div>';
  }
  el.innerHTML = h;
  checkScanResults(drives);
}

// ==================== USB Boot Mode (Compute Modules) ====================
// A CM with nRPIBOOT fitted shows up as a bare boot ROM. From here it can be turned
// into a USB disk (mass-storage gadget) or have its bootloader EEPROM read/rewritten.
const RPIBOOT_OP_NAMES = { msd: 'Mass storage', 'eeprom-check': 'Bootloader info', 'eeprom-write': 'Bootloader write' };

function renderBootDevices(s) {
  const devs = s.bootDevices || [];
  const ops = (s.operations || []).filter(o => o.device.startsWith('usb:'));
  const results = s.rpibootResults || [];
  const show = devs.length || ops.length || results.length;
  Q('#boot-section').classList.toggle('hidden', !show);
  if (!show) return;

  let h = '';
  if (!s.rpibootInstalled) h += '<div class="no-parts" style="padding:12px 18px">rpiboot is not installed on this host. Run <span class="mono">sudo apt install rpiboot</span>.</div>';
  const paths = [...new Set([...devs.map(d => d.path), ...ops.map(o => o.device.slice(4)), ...results.map(r => r.path)])].sort();
  for (const path of paths) {
    const d = devs.find(x => x.path === path);
    const pOps = ops.filter(o => o.device === 'usb:' + path);
    const busy = pOps.some(o => !['done', 'error', 'queued'].includes(o.status));
    const r = results.find(x => x.path === path);
    h += `<div class="drive-card"><div class="drive-hdr"><div class="drive-info">
      <span class="drive-model">${d ? esc(d.label) : 'Left USB boot mode'}</span>
      <span class="drive-meta">USB port ${esc(path)}${d?.serial ? ' · S/N: ' + esc(d.serial) : ''}${d?.product ? ' · ' + esc(d.product) : ''}</span>
    </div></div>`;

    for (const op of pOps) {
      const cls = op.status === 'done' ? 'done' : op.status === 'error' ? 'error' : 'active';
      h += `<div class="drive-op">
        <div class="op-row"><span class="op-type">${RPIBOOT_OP_NAMES[op.type] || esc(op.type)}</span>
        ${cls === 'active' ? `<button class="btn btn-sm btn-danger" onclick="cancelOp('${op.id}')">Cancel</button>` : ''}</div>
        <div class="op-msg">${esc(op.message)}</div>
        <div class="op-bar"><div class="op-fill ${cls}" style="width:${op.progress}%"></div></div>
      </div>`;
    }

    if (r) h += bootResultHtml(r);

    if (d && s.rpibootInstalled) {
      const p = esc(JSON.stringify(path));
      const eeprom = d.chip !== '2835';
      h += `<div class="drive-actions">
        <button class="btn btn-primary" onclick="rpibootMsd(${p})" ${busy ? 'disabled' : ''}>Load mass-storage gadget</button>
        ${eeprom ? `<button class="btn" onclick="rpibootCheck(${p})" ${busy ? 'disabled' : ''}>Bootloader info</button>
        <button class="btn btn-warn" onclick="rpibootWrite(${p})" ${busy ? 'disabled' : ''}>Bootloader settings &amp; update…</button>` : ''}
      </div>
      <div class="img-detail" style="margin-top:6px">Mass storage exposes the module's eMMC/NVMe here as a drive to flash, browse or erase.${eeprom ? ' Bootloader info reads the board, MAC and installed bootloader without writing anything.' : ''}</div>`;
    }
    h += '</div>';
  }
  Q('#boot-devices').innerHTML = h;
}

function bootResultHtml(r) {
  const m = r.metadata || {};
  const rows = [];
  if (r.installed) rows.push(['Bootloader', r.installed.label + (r.installed.bootConf ? ' · settings known' : '')]);
  if (r.installed?.lastWrite) rows.push(['Last DeskyPi write', `${r.installed.lastWrite.imageLabel}, ${new Date(r.installed.lastWrite.at).toLocaleString()} (replaced since)`]);
  if (r.board) rows.push(['Board', `${r.board.model} · ${r.board.memory} · rev ${r.board.revision}`]);
  if (m.USER_BOARDREV) rows.push(['Board revision', m.USER_BOARDREV]);
  if (m.MAC_ADDR) rows.push(['MAC', m.MAC_ADDR]);
  if (m.CUSTOMER_KEY_HASH) rows.push(['Secure boot', /^0*$/.test(m.CUSTOMER_KEY_HASH) ? 'not provisioned' : 'customer key programmed: ' + m.CUSTOMER_KEY_HASH.slice(0, 16) + '…']);
  if (m.JTAG_LOCKED) rows.push(['JTAG', m.JTAG_LOCKED === '1' ? 'locked' : 'unlocked']);
  if (m.EEPROM_UPDATE) rows.push(['EEPROM update', m.EEPROM_UPDATE]);
  if (m.EEPROM_HASH) rows.push(['EEPROM hash', m.EEPROM_HASH]);
  for (const [k, v] of Object.entries(m)) if (!['USER_BOARDREV', 'MAC_ADDR', 'CUSTOMER_KEY_HASH', 'JTAG_LOCKED', 'EEPROM_UPDATE', 'EEPROM_HASH'].includes(k)) rows.push([k, v]);
  const when = new Date(r.at).toLocaleTimeString();
  return `<div class="drive-op">
    <div class="op-row"><span><span class="op-type">${RPIBOOT_OP_NAMES[r.kind]}</span> · ${esc(when)}</span>
    <button class="btn btn-sm" onclick="rpibootDismiss(${esc(JSON.stringify(r.path))})">Dismiss</button></div>
    <div class="op-msg" style="color:${r.ok ? 'var(--success)' : 'var(--danger)'}">${esc(r.message)}</div>
    ${rows.length ? `<table class="net-tbl mono" style="margin-top:6px;font-size:.72rem"><tbody>${rows.map(([k, v]) => `<tr><td style="color:var(--dim);padding-right:12px;white-space:nowrap;width:1%">${esc(k)}</td><td style="word-break:break-all">${esc(v)}</td></tr>`).join('')}</tbody></table>` : ''}
  </div>`;
}

async function rpibootPost(url, body) {
  try {
    const r = await (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (!r.ok) toast(r.message, 'error');
    return r.ok;
  } catch { toast('Request failed', 'error'); return false; }
}

async function rpibootMsd(path) {
  await rpibootPost('/api/rpiboot/msd', { path });
}

async function rpibootCheck(path) {
  await rpibootPost('/api/rpiboot/eeprom/check', { path });
}

async function rpibootDismiss(path) {
  await rpibootPost('/api/rpiboot/results/clear', { path });
}

// ==================== Bootloader settings (boot.conf) ====================
// The boot.conf text is the source of truth. The form only reads and rewrites keys in the
// unconditional part of the file ([all], or lines before any section), so comments,
// unknown keys and conditional sections like [gpio4=0] survive untouched. A [config.txt]
// section runs to the end of the file, so nothing after it is touched either.
// Property reference: https://www.raspberrypi.com/documentation/computers/raspberry-pi.html#raspberry-pi-bootloader-configuration

const BL_MODES = {
  '1': 'eMMC / SD', '2': 'Network', '3': 'RPIBOOT', '4': 'USB storage', '5': 'USB 2.0 (BCM)',
  '6': 'NVMe', '7': 'HTTP', 'e': 'Stop', 'f': 'Restart', '0': 'SD detect',
};
// Keyed by blBoard(): chip, plus "cm" for Compute Modules. The flagship ones match the
// boot orders in Imager's three Bootloader images (rpi-eeprom release zips, 2026-09).
const BL_ORDER_PRESETS = {
  '2711cm': [['0xf25641', "eMMC, USB, NVMe, USB 2.0, network (rpiboot's CM4 default)"], ['0xf41', 'eMMC, USB (firmware default)'], ['0xf461', 'eMMC, NVMe, USB'], ['0xf416', 'NVMe, eMMC, USB'], ['0xf14', 'USB, eMMC'], ['0xf21', 'eMMC, network']],
  '2712cm': [['0xf2461', "eMMC, NVMe, USB, network (rpiboot's CM5 default)"], ['0xf461', 'eMMC, NVMe, USB (image default)'], ['0xf416', 'NVMe, eMMC, USB'], ['0xf146', 'NVMe, USB, eMMC'], ['0xf14', 'USB, eMMC'], ['0xf21', 'eMMC, network']],

const BL_GROUPS = ['Boot', 'Power', 'Diagnostics', 'Updates', 'USB & PCIe', 'Network boot'];

// Line indexes in the unconditional part of the file.
function blParse(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const uncond = [];
  let inAll = true;
  for (let i = 0; i < lines.length; i++) {
    const h = lines[i].match(/^\s*\[([^\]]*)\]/);
    if (h) {
      const f = h[1].trim().toLowerCase();
      if (f === 'config.txt') break;
      inAll = f === 'all';
    } else if (inAll) uncond.push(i);
  }
  return { lines, uncond };
}
function blKV(line) {
  const m = line.match(/^\s*([A-Za-z0-9_]+)\s*=(.*)$/);
  return m ? [m[1].toUpperCase(), m[2].trim()] : null;
}
function blValues(text) {
  const { lines, uncond } = blParse(text);
  const v = {};
  for (const i of uncond) { const kv = blKV(lines[i]); if (kv) v[kv[0]] = kv[1]; }
  return v;
}
// Set (or with val null, remove) a key: rewrites the last unconditional occurrence and
// drops earlier ones; a new key goes after the first unconditional block.
function blSet(text, key, val) {
  const { lines, uncond } = blParse(text);
  const hits = uncond.filter(i => blKV(lines[i])?.[0] === key);
  const drop = val == null ? hits : hits.slice(0, -1);
  if (val != null) {
    if (hits.length) lines[hits.at(-1)] = `${key}=${val}`;
    else {
      let at = 0;
      if (uncond.length) {
        at = uncond[0];
        for (let k = 0; k < uncond.length && uncond[k] === uncond[0] + k; k++) if (lines[uncond[k]].trim()) at = uncond[k] + 1;
      }
      lines.splice(at, 0, `${key}=${val}`);
    }
  }
  for (const i of [...drop].sort((a, b) => b - a)) lines.splice(i, 1);
  return lines.join('\n');
}
// The conditional sections, for noticing edits the key diff can't show.
function blRest(text) {
  const { lines, uncond } = blParse(text);
  const u = new Set(uncond);
  return lines.filter((l, i) => !u.has(i) && l.trim() && !/^\s*\[all\]\s*$/i.test(l)).join('\n');
}

// BOOT_ORDER is read right to left: one hex nibble per mode, lowest first.
function blOrderItems(v) {
  if (v == null || v === '') return [];
  const hex = v.trim().toLowerCase().replace(/^0x/, '').replace(/^0+(?=.)/, '');
  return /^[0-9a-f]{1,8}$/.test(hex) ? [...hex].reverse() : null;
}
function blOrderHex(items) { return items.length ? '0x' + [...items].reverse().join('') : null; }

// The open editor: { chip, cm, o (options from the server), starts() -> starting points,
// text, base, baseLabel, start }. Shared by the CM dialog (rpibootWrite) and the SD card
// dialog (blCardModal).
let bl = null;

function blBoard() { return bl.chip + (bl.cm ? 'cm' : ''); }
function blSettingDefault(s) { return typeof s.def === 'object' ? s.def[blBoard()] ?? s.def[bl.chip] : s.def; }
function blModeLabel(m) { return m === '1' && !bl.cm ? 'SD card' : BL_MODES[m] || '0x' + m; }

function blFieldHtml(s) {
  const id = 'bls-' + s.key;
  const def = blSettingDefault(s);
  let ctl;
  if (s.t === 'bool') {
    ctl = `<select id="${id}" onchange="blField('${s.key}')"><option value="">Default (${def === '1' ? 'on' : 'off'})</option><option value="1">On</option><option value="0">Off</option></select>`;
  } else if (s.t === 'select') {
    const dl = s.options.find(([v]) => v === def)?.[1];
    ctl = `<select id="${id}" onchange="blField('${s.key}')"><option value="">Default${dl ? ` (${esc(dl)})` : ''}</option>${s.options.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;
  } else {
    const ph = s.ph || (def !== '' ? `Default: ${def}` : 'Not set');
    ctl = `<input type="text" id="${id}" ${s.t === 'int' ? 'inputmode="numeric"' : ''} placeholder="${esc(ph)}" spellcheck="false" oninput="blField('${s.key}')">`;
  }
  return `<div class="fg"><label for="${id}">${esc(s.label)}</label>${ctl}${s.hint ? `<div class="img-detail">${esc(s.hint)}</div>` : ''}</div>`;
}

function blSettings() {
  return BL_SETTINGS.filter(s => (!s.chips || s.chips.includes(bl.chip)) && (!s.board || s.board === (bl.cm ? 'cm' : 'flagship')));
}

function blFormHtml() {
  const vals = blValues(bl.text);
  let h = '';
  for (const g of BL_GROUPS) {
    const ss = blSettings().filter(s => s.g === g);
    const set = ss.some(s => s.key in vals);
    const open = g === 'Boot' || g === 'Power' || set;
    h += `<details ${open ? 'open' : ''}><summary>${esc(g)}</summary>`;
    if (g === 'Boot') h += `<div class="fg"><label>Boot order</label><div id="bl-order"></div></div>`;
    h += `<div class="settings-grid">${ss.map(blFieldHtml).join('')}</div></details>`;
  }
  return h;
}

function blOrderHtml() {
  const chip = bl.chip;
  const raw = blValues(bl.text).BOOT_ORDER;
  const items = blOrderItems(raw);
  if (items === null) return `<div class="bl-warn">BOOT_ORDER=${esc(raw)} isn't a hex number. Fix it in boot.conf.</div>`;
  let h = '<div class="bl-order">';
  if (!items.length) h += `<span class="img-detail">Not set: the firmware default, ${bl.cm ? 'eMMC/SD' : 'SD card'} then USB, repeating (0xf41).</span>`;
  items.forEach((m, i) => {
    const term = m === 'e' || m === 'f';
    h += `${i ? '<span class="bl-sep">→</span>' : ''}<span class="bl-pill${term ? ' term' : ''}">${esc(blModeLabel(m))}
      <button type="button" onclick="blOrderMove(${i},-1)" ${i === 0 ? 'disabled' : ''} aria-label="Earlier">‹</button><button type="button" onclick="blOrderMove(${i},1)" ${i === items.length - 1 ? 'disabled' : ''} aria-label="Later">›</button><button type="button" onclick="blOrderMove(${i},0)" aria-label="Remove">✕</button></span>`;
  });
  h += '</div>';
  const nvme = chip === '2712' || bl.cm; // CM4 has PCIe; the Pi 4 doesn't
  const modes = ['1', ...(nvme ? ['6'] : []), '4', ...(chip === '2711' ? ['5'] : []), '2', '7', '3', 'f', 'e'];
  h += `<div class="bl-tools">
    <select onchange="blOrderAdd(this.value);this.value=''" ${items.length >= 8 ? 'disabled' : ''}><option value="">+ Add boot mode…</option>${modes.map(m => `<option value="${m}">${esc(blModeLabel(m))}</option>`).join('')}</select>
    <select onchange="blOrderPreset(this.value);this.value=''"><option value="">Presets…</option>${BL_ORDER_PRESETS[blBoard()].map(([v, l]) => `<option value="${v}">${esc(v)}: ${esc(l)}</option>`).join('')}</select>
    ${items.length ? `<span class="img-detail mono" style="align-self:center">BOOT_ORDER=${esc(blOrderHex(items))}</span>` : ''}
  </div>`;
  const warn = [];
  const stopAt = items.findIndex(m => m === '3' || m === 'e' || m === 'f');
  if (stopAt !== -1 && stopAt < items.length - 1) warn.push(`Nothing after ${blModeLabel(items[stopAt])} is ever tried.`);
  if (items.length && !['f', 'e', '3'].includes(items.at(-1))) warn.push(`No Restart at the end: the ${bl.cm ? 'module' : 'Pi'} halts with an error if every mode fails.`);
  if (chip === '2712' && items.includes('5')) warn.push('USB 2.0 (BCM) boot is not available on BCM2712.');
  if (!nvme && items.includes('6')) warn.push('The Pi 4 has no NVMe boot.');
  if (items.includes('0')) warn.push('SD detect (0) is deprecated. Use Restart instead.');
  h += warn.map(w => `<div class="bl-warn">⚠️ ${esc(w)}</div>`).join('');
  return h;
}

// Push the text into the form (after loading a starting point or editing the raw text).
function blSyncForm() {
  const vals = blValues(bl.text);
  for (const s of blSettings()) {
    const el = Q('#bls-' + s.key);
    if (!el || el === document.activeElement) continue;
    const v = vals[s.key] ?? '';
    if (el.tagName === 'SELECT' && v !== '' && ![...el.options].some(o => o.value === v)) {
      el.add(new Option(`${v} (custom)`, v)); // keep a value the form doesn't know as-is
    }
    el.value = v;
    el.classList.remove('bad');
  }
  Q('#bl-order').innerHTML = blOrderHtml();
  const known = new Set(['BOOT_ORDER', ...BL_SETTINGS.map(s => s.key)]);
  const extra = Object.keys(vals).filter(k => !known.has(k));
  Q('#bl-extra').innerHTML = extra.length ? `Also set, edit in boot.conf: <span class="mono">${extra.map(esc).join(', ')}</span>` : '';
  blSyncDiff();
}

function blSyncDiff() {
  const a = blValues(bl.base), b = blValues(bl.text);
  const rows = [];
  for (const k of [...new Set([...Object.keys(a), ...Object.keys(b)])]) {
    if (a[k] === b[k]) continue;
    rows.push(`<div>${esc(k)}: ${k in a ? `<span class="old">${esc(a[k])}</span> ` : ''}${k in b ? `<span class="new">${esc(b[k])}</span>` : '(default)'}</div>`);
  }
  if (blRest(bl.base) !== blRest(bl.text)) rows.push('<div>Conditional sections changed (see boot.conf)</div>');
  Q('#bl-diff').innerHTML = `<div style="margin-bottom:2px">Changes from ${esc(bl.baseLabel)}:</div>${rows.join('') || '<div>none</div>'}`;
}

function blSetText(text) {
  bl.text = text;
  Q('#bl-conf').value = text;
  blSyncForm();
}

function blField(key) {
  const s = BL_SETTINGS.find(x => x.key === key);
  const el = Q('#bls-' + key);
  let v = el.value.replace(/[\r\n]/g, '').trim();
  if (s.t === 'int' && v !== '') {
    const n = Number(v);
    const ok = /^-?\d+$/.test(v) && (s.min == null || n >= s.min) && (s.max == null || n <= s.max);
    el.classList.toggle('bad', !ok);
    if (!ok) return;
  }
  el.classList.remove('bad');
  bl.text = blSet(bl.text, key, v === '' ? null : v);
  Q('#bl-conf').value = bl.text;
  Q('#bl-order').innerHTML = blOrderHtml();
  blSyncDiff();
}

function blOrderSave(items) {
  blSetText(blSet(bl.text, 'BOOT_ORDER', blOrderHex(items)));
}
function blOrderMove(i, d) {
  const items = blOrderItems(blValues(bl.text).BOOT_ORDER) || [];
  if (d === 0) items.splice(i, 1);
  else [items[i], items[i + d]] = [items[i + d], items[i]];
  blOrderSave(items);
}
function blOrderAdd(m) {
  if (!m) return;
  const items = blOrderItems(blValues(bl.text).BOOT_ORDER) || [];
  // New modes go before a trailing Restart/Stop, which only makes sense last.
  const end = items.length && ['f', 'e'].includes(items.at(-1)) && !['f', 'e'].includes(m) ? items.length - 1 : items.length;
  items.splice(end, 0, m);
  blOrderSave(items.slice(0, 8));
}
function blOrderPreset(v) {
  if (v) blSetText(blSet(bl.text, 'BOOT_ORDER', v));
}

// Starting points, each [id, button label, text, "changes from …" label]. The selected
// release's own built-in config is always one of them.
function blSelectedImage() { return bl.o.images.find(i => i.id === Q('#bl-img')?.value) || bl.o.images[0]; }
function blImageStart() {
  const img = blSelectedImage();
  return img?.config ? [['image', 'Release built-in', img.config, `the ${img.buildDate} release's built-in config`]] : [];
}
function blStarts() { return bl.starts(); }
function blStartsHtml() {
  return 'Start from: ' + blStarts().map(([id, label]) => `<button type="button" class="btn btn-sm${bl.start === id ? ' btn-primary' : ''}" onclick="blLoad('${id}')">${esc(label)}</button>`).join('');
}
function blLoad(id) {
  const s = blStarts().find(x => x[0] === id);
  if (!s) return;
  bl.start = id;
  bl.base = s[2];
  bl.baseLabel = s[3];
  Q('#bl-starts').innerHTML = blStartsHtml();
  blSetText(s[2]);
}

function blInstalledHtml(o) {
  const inst = o.installed;
  if (!inst) return `<div class="modal-dev">Installed bootloader: <b>not checked</b>
    <div class="img-detail" style="margin-top:4px">Nothing can read the bootloader back over USB, but <b>Bootloader info</b> can often recognise it. Run it first, power-cycle the module, then come back here to start from its current settings.</div></div>`;
  return `<div class="modal-dev">Installed bootloader: <b>${esc(inst.label)}</b>${o.checkedAt ? ` <span style="color:var(--dim)">(checked ${esc(new Date(o.checkedAt).toLocaleTimeString())})</span>` : ''}
    ${inst.bootConf == null ? '<div class="img-detail" style="margin-top:4px">Its settings are unknown, so whatever is written here replaces them completely.</div>' : ''}
    ${inst.lastWrite ? `<div class="img-detail" style="margin-top:4px">DeskyPi last wrote ${esc(inst.lastWrite.imageLabel)} to this module on ${esc(new Date(inst.lastWrite.at).toLocaleString())}; something has replaced it since.</div>` : ''}</div>`;
}

function blImageOpts(o) {
  const have = o.installed?.buildDate;
  const newest = o.images.reduce((a, i) => (i.buildDate > a ? i.buildDate : a), '');
  const pick = o.images.find(i => i.id === 'default') || o.images[0];
  return o.images.map(im => {
    const tag = !have ? '' : im.buildDate === have ? ' · installed' : im.buildDate > have ? ' · newer than installed' : ' · older than installed';
    return `<option value="${esc(im.id)}"${im === pick ? ' selected' : ''}>${esc(im.label)}${tag}${im.buildDate === newest && o.images.length > 1 ? ' · newest' : ''}</option>`;
  }).join('');
}

// Release picker, starting points, form and raw boot.conf: the part both dialogs share.
function blEditorHtml() {
  return `<div class="flash-form">
      <div class="fg"><label for="bl-img">Bootloader release</label><select id="bl-img">${blImageOpts(bl.o)}</select></div>
      <div class="bl-starts" id="bl-starts"></div>
      <div class="bl-grid">
        <div class="bl-form">${blFormHtml()}<div class="img-detail" id="bl-extra"></div></div>
        <div class="bl-raw">
          <div class="fg"><label for="bl-conf">boot.conf</label></div>
          <textarea id="bl-conf" spellcheck="false" oninput="bl.text=this.value;blSyncForm()"></textarea>
          <div class="img-detail">Embedded into the image. Edits here and in the form stay in sync; conditional sections such as <span class="mono">[gpio4=0]</span> are kept as written.</div>
          <div class="bl-diff" id="bl-diff"></div>
        </div>
      </div>
    </div>`;
}
// After blEditorHtml is in the page: load the first available of the preferred starts.
function blMount(prefer) {
  const ids = blStarts().map(s => s[0]);
  blLoad(prefer.find(id => ids.includes(id)) || ids[0]);
  Q('#bl-img').onchange = () => { Q('#bl-starts').innerHTML = blStartsHtml(); };
}
// The edited boot.conf, or null (with a toast) when it can't be written yet.
function blReady() {
  if (Q('#modal .bad')) { toast('Fix the highlighted settings first', 'error'); return null; }
  if (!bl.text.trim()) { toast('boot.conf is empty', 'error'); return null; }
  return bl.text;
}

async function rpibootWrite(path) {
  let o;
  try { o = await (await fetch('/api/rpiboot/eeprom/options?path=' + encodeURIComponent(path))).json(); } catch { o = { ok: false, message: 'Request failed' }; }
  if (!o.ok) return toast(o.message, 'error');
  if (!o.images.length) return toast('No bootloader images found (is rpi-eeprom installed?)', 'error');
  // Starting points: what's installed (when recognised), DeskyPi's last write to this
  // module, rpiboot's CM default, or the chosen release's own built-in config.
  const starts = () => {
    const inst = o.installed, s = [];
    if (inst?.bootConf != null) s.push(['installed', 'Installed settings', inst.bootConf, 'the installed settings']);
    if (inst?.lastWrite) s.push(['last', "DeskyPi's last write", inst.lastWrite.bootConf, "DeskyPi's last write"]);
    s.push(['rpiboot', "rpiboot's CM default", o.bootConf, "rpiboot's CM default"]);
    return [...s, ...blImageStart()];
  };
  bl = { chip: o.chip, cm: true, o, starts, text: '', base: '', baseLabel: '', start: '' };
  showModal(`<h3>Bootloader settings &amp; update</h3>
    <p>Rewrites the SPI bootloader EEPROM of the BCM${esc(o.chip)} on USB port <span class="mono">${esc(path)}</span> with the chosen release and settings. A bad write isn't permanent: the module can always be recovered again from here.</p>
    ${blInstalledHtml(o)}
    ${blEditorHtml()}
    <div class="modal-btns">
      <button class="btn" id="mc">Cancel</button>
      <button class="btn" id="bl-recover">Recover (stock image + config)</button>
      <button class="btn btn-warn" id="mk">Write bootloader</button>
    </div>
    <div class="img-detail" style="text-align:right;margin-top:6px">Recover writes rpiboot's stock release with its stock config: the known-good choice for a module that won't boot.</div>`, 'wide');
  blMount(['installed', 'last', 'rpiboot']);
  const go = async (imageId, bootConf) => {
    hideModal();
    await rpibootPost('/api/rpiboot/eeprom/write', { path, imageId, bootConf });
  };
  Q('#mc').onclick = hideModal;
  Q('#mk').onclick = () => {
    const conf = blReady();
    if (conf != null) go(Q('#bl-img').value, conf);
  };
  Q('#bl-recover').onclick = () => {
    if (!o.images.some(i => i.id === 'rpiboot')) return toast("rpiboot's stock image is missing", 'error');
    go('rpiboot', o.bootConf);
  };
  Q('#modal-bg').onclick = e => { if (e.target === Q('#modal-bg')) hideModal(); };
}

// ==================== Bootloader update SD cards ====================
// For ordinary Pi 4/400 and Pi 5/500 boards: a card holding recovery.bin and the built
// EEPROM image, which the boot ROM runs at power-on. The server builds it to fit any
// card, so it works on the small cards Imager refuses (its image is 258 MiB).

function blCardDrive(name) {
  const d = (S?.drives || []).find(x => x.name === name);
  if (d) blCardModal(d.name, d.model || d.name, d.size, !!d.hasPartitions);
}

function blCardModal(dev, model, size, hasParts) {
  let chip = localStorage.getItem('blcard-chip') === '2711' ? '2711' : '2712';
  bl = null;
  showModal(`<h3>Bootloader update card</h3>
    <p>Erases this card and writes one that updates a Raspberry Pi's bootloader when the Pi boots from it, with the release and settings chosen here. Any card from 16 MB up works, including ones too small for Imager's 258 MB image.</p>
    <div class="modal-dev">${esc(model)}<br>/dev/${esc(dev)} · ${fmtSz(size)}</div>
    <div class="fg"><label for="blc-board">Board</label><select id="blc-board"><option value="2711">Raspberry Pi 4 / 400</option><option value="2712">Raspberry Pi 5 / 500</option></select>
      <div class="img-detail">Compute Modules can't update from a card: put them in USB boot mode and use <b>Bootloader settings &amp; update</b> instead.</div></div>
    <div id="blc-editor" style="margin-top:12px"></div>
    ${hasParts ? '<div class="confirm-box"><label for="ec">This card has partitions. Type ERASE to confirm:</label><input type="text" id="ec" autocomplete="off"></div>' : ''}
    <div class="modal-btns"><button class="btn" id="mc">Cancel</button><button class="btn ${hasParts ? 'btn-danger' : 'btn-warn'}" id="mk" ${hasParts ? 'disabled' : ''}>Erase &amp; write card</button></div>`, 'wide');

  const load = async () => {
    const want = chip;
    Q('#blc-editor').innerHTML = '<div class="img-detail">Loading releases…</div>';
    let o;
    try { o = await (await fetch('/api/blcard/options?chip=' + want)).json(); } catch { o = { ok: false, message: 'Request failed' }; }
    if (chip !== want || !Q('#blc-editor')) return; // board changed, or the dialog closed
    if (!o.ok || !o.images.length) {
      Q('#blc-editor').innerHTML = `<div class="bl-warn">${esc(o.ok ? 'No bootloader releases found (is rpi-eeprom installed?)' : o.message)}</div>`;
      return;
    }
    // The last card's settings for this board, so a batch of cards comes out the same.
    const last = localStorage.getItem('blcard-conf-' + want);
    bl = {
      chip: want, cm: false, o, text: '', base: '', baseLabel: '', start: '',
      starts: () => [...(last ? [['last', 'Last card', last, 'the last card written here']] : []), ...blImageStart()],
    };
    Q('#blc-editor').innerHTML = blEditorHtml();
    blMount(['last', 'image']);
  };

  Q('#blc-board').value = chip;
  Q('#blc-board').onchange = () => {
    chip = Q('#blc-board').value;
    localStorage.setItem('blcard-chip', chip);
    bl = null;
    load();
  };
  if (hasParts) Q('#ec').oninput = () => { Q('#mk').disabled = Q('#ec').value !== 'ERASE'; };
  Q('#mc').onclick = hideModal;
  Q('#mk').onclick = async () => {
    if (!bl || bl.chip !== chip) return toast('Still loading the releases', 'error');
    if (hasParts && Q('#ec').value !== 'ERASE') return;
    const conf = blReady();
    if (conf == null) return;
    const imageId = Q('#bl-img').value;
    hideModal();
    try {
      const r = await (await fetch('/api/blcard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ device: dev, chip, imageId, bootConf: conf }) })).json();
      if (!r.ok) return toast(r.message, 'error');
      localStorage.setItem('blcard-conf-' + chip, conf);
    } catch { toast('Request failed', 'error'); }
  };
  Q('#modal-bg').onclick = e => { if (e.target === Q('#modal-bg')) hideModal(); };
  load();
}
